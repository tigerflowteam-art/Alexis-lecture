    listenText(ctx, step.word.t);

    var dots = el('div', 'claps');
    var made = [];
    for (var i = 0; i < step.word.n; i++) dots.appendChild(el('span', 'claps__d'));
    ctx.root.appendChild(dots);

    var pad = el('button', 'clappad', '\ud83d\udc4f');
    pad.addEventListener('click', function () {
      if (made.length >= step.word.n) return;
      var d = dots.children[made.length];
      d.classList.add('is-on');
      made.push(1);
      App.Audio.sfx.pop();
      pad.classList.add('is-hit');
      setTimeout(function () { pad.classList.remove('is-hit'); }, 160);
      if (made.length === step.word.n) {
        ctx.playText(step.word.t);
        setTimeout(function () { ctx.win(); }, 500);
      }
    });
    ctx.root.appendChild(pad);
  };

  A.wrap = function (step, ctx) { ctx.win(true); };

  return {
    render: function (step, ctx) {
      var f = A[step.act];
      if (!f) { ctx.win(true); return false; }
      f(step, ctx);
      return true;
    },
    list: function () { return Object.keys(A); },
    _el: el,
    _shuffle: shuffle
  };
})();

</script>
<script>
/* ===== js/rewards.js ===== */
/* =========================================================
   js/rewards.js — Attribution des recompenses

   Rien d'aleatoire : on relit l'etat reel et on attribue ce qui
   vient d'etre merite. Chaque gain alimente aussi l'album.
   ========================================================= */

window.App = window.App || {};

App.Rewards = (function () {

  function owned() { return App.State.get().badges; }

  /* Renvoie la liste des recompenses gagnees a l'instant */
  function check() {
    var s = App.State.get();
    var gained = [];

    DATA.trophies.forEach(function (t) {
      if (s.badges.indexOf(t.id) >= 0) return;
      var ok = false;
      try { ok = t.when(App.State); } catch (e) { ok = false; }
      if (ok) {
        s.badges.push(t.id);
        gained.push({ icon: t.icon, label: t.label, kind: 'trophy' });
        App.State.remember(t.icon, t.label);
      }
    });

    var totalMissions = App.State.missionsDone('fr') + App.State.missionsDone('en');

    DATA.accessories.forEach(function (a) {
      if (s.accessories.indexOf(a.id) >= 0) return;
      if (totalMissions >= a.need) {
        s.accessories.push(a.id);
        gained.push({ icon: a.icon, label: a.label, kind: 'accessory' });
      }
    });

    DATA.avatars.forEach(function (a) {
      if (a.need && totalMissions >= a.need && s.badges.indexOf('avatar:' + a.id) < 0) {
        s.badges.push('avatar:' + a.id);
        gained.push({ icon: a.icon, label: a.label, kind: 'avatar' });
      }
    });

    App.State.save();
    return gained;
  }

  function avatarUnlocked(a) {
    if (!a.need) return true;
    return App.State.missionsDone('fr') + App.State.missionsDone('en') >= a.need;
  }

  function accessoryUnlocked(a) {
    return App.State.get().accessories.indexOf(a.id) >= 0;
  }

  function trophyOwned(t) {
    return App.State.get().badges.indexOf(t.id) >= 0;
  }

  function avatarIcon() {
    var id = App.State.get().child.avatar;
    var a = DATA.avatars.filter(function (x) { return x.id === id; })[0];
    return a ? a.icon : '\ud83e\udd8a';
  }

  return {
    check: check, owned: owned,
    avatarUnlocked: avatarUnlocked, accessoryUnlocked: accessoryUnlocked,
    trophyOwned: trophyOwned, avatarIcon: avatarIcon
  };
})();

</script>
<script>
/* ===== js/mission.js ===== */
/* =========================================================
   js/mission.js — Le deroule d'une mission

   Gere : la barre d'etapes, les phases affichees, le feedback
   bienveillant, l'ETAYAGE (§16) et l'ecran de fin.

   Etayage : apres deux erreurs sur une etape qui declare un
   "scaffold", on ne repropose pas le meme obstacle. On redescend
   la marche : MAT -> M -> A -> MA -> MAT, puis on revient.
   ========================================================= */

window.App = window.App || {};

App.Mission = (function () {

  var box, bar, taskEl, quitEl, phaseEl;
  var m = null, lang = 'fr', idx = 0, tries = 0, t0 = 0, stars = 0, missed = 0;
  var onDone = null;
  var busy = false;

  function el(t, c, x) { return App.Activities._el(t, c, x); }

  function mount() {
    box = document.getElementById('mission');
    bar = document.getElementById('mBar');
    taskEl = document.getElementById('mTask');
    quitEl = document.getElementById('mQuit');
    phaseEl = document.getElementById('mPhase');
    if (quitEl) quitEl.addEventListener('click', quit);
  }

  function byId(id) {
    var all = (DATA.missions.fr || []).concat(DATA.missions.en || []);
    for (var i = 0; i < all.length; i++) if (all[i].id === id) return all[i];
    return null;
  }

  function start(missionId, then) {
    m = typeof missionId === 'string' ? byId(missionId) : missionId;
    if (!m || m.locked || !m.steps) { if (then) then(); return false; }
    onDone = then || null;
    lang = m.id.indexOf('en.') === 0 ? 'en' : 'fr';
    idx = 0; tries = 0; stars = 0; missed = 0; t0 = Date.now();
    box.hidden = false;
    document.documentElement.setAttribute('data-lang', lang);
    render();
    return true;
  }

  function quit() {
    App.Audio.stop();
    box.hidden = true;
    document.documentElement.setAttribute('data-lang', App.State.lang());
    var f = onDone; onDone = null;
    if (f) f(); else { App.Session.clear(); App.UI.refresh(); }
  }

  /* ---------- Barre d'etapes ---------- */

  function drawBar() {
    bar.innerHTML = '';
    m.steps.forEach(function (s, i) {
      var d = el('span', 'mbar__s' + (i < idx ? ' is-done' : i === idx ? ' is-now' : ''));
      bar.appendChild(d);
    });
    var st = m.steps[idx];
    phaseEl.textContent = st ? App.T('ph_' + st.phase, lang) : '';
  }

  /* ---------- Rendu d'une etape ---------- */

  var watchdog = null;

  function render() {
    busy = false;
    tries = 0;
    if (watchdog) clearTimeout(watchdog);
    App.Audio.stop();
    taskEl.innerHTML = '';
    taskEl.scrollTop = 0;
    drawBar();

    var step = m.steps[idx];
    if (!step) return finish();
    if (step.act === 'wrap') return finish();
    var startedAt = idx;

    var c = ctx(step);
    spoken = null;
    App.Activities.render(step, c);

    /* L'enfant ne doit pas avoir a LIRE pour savoir quoi faire :
       la consigne part toute seule, dans les deux langues. */
    setTimeout(function () { if (idx === startedAt) c.sayInstruction(); }, 380);

    /* Si quoi que ce soit se coince (audio, animation), on rend la main
       plutot que de laisser l'enfant devant un ecran mort. */
    var mine = idx;
    watchdog = setTimeout(function () {
      if (idx === mine && busy) {
        busy = false;
        var ov = taskEl.querySelector('.scaffold');
        if (ov) ov.remove();
      }
    }, 12000);
  }

  /* ---------- Le canal "consigne" ----------
     Une seule activite a la fois declare ce que la voix doit dire.
     Le runner le joue automatiquement a l'ouverture, et le bouton
     haut-parleur le rejoue a l'identique. */
  var spoken = null;

  function ctx(step) {
    return {
      lang: lang,
      mission: m,
      root: taskEl,
      T: function (k) { return App.T(k, lang); },
      play: function (key) { return App.Audio.play(key); },
      playText: function (txt, l) { return App.Audio.speak(txt, l || lang); },
      win: function (silent) { win(step, silent); },
      miss: function (node, grid) { miss(step, node, grid); },

      /* Consigne standard : cle i18n + mot dynamique + materiel sonore */
      setInstruction: function (key, opts) {
        opts = opts || {};
        spoken = function () {
          return sayKey(key)
            .then(function () { return opts.after ? pause(180).then(function () { return App.Audio.speak(opts.after, lang); }) : null; })
            .then(function () { return opts.then ? pause(260).then(opts.then) : null; })
            .catch(function () {});
        };
      },
      /* Cas particuliers (decouverte, revision) : une sequence libre */
      setSpoken: function (fn) { spoken = fn; },
      sayInstruction: function () { return spoken ? spoken() : Promise.resolve(); }
    };
  }

  function pause(ms) { return new Promise(function (r) { setTimeout(r, ms); }); }

  /* Une consigne est d'abord un FICHIER audio (lang:instruction:cle).
     La synthese ne prend le relais que s'il n'existe pas encore. */
  function sayKey(key) {
    var k = lang + ':instruction:' + App.Audio.slugify(key);
    return App.Audio.play(k);
  }

  /* ---------- Reussite ---------- */

  function win(step, silent) {
    if (busy) return;
    busy = true;
    var sk = step.skill || m.skill;
    if (sk) App.State.record(sk, phaseDim(step.phase), tries === 0);
    if (tries === 0) stars++;

    if (silent) {
      setTimeout(next, 260);
      return;
    }
    App.Audio.sfx.good();
    var k = tries === 0 ? 'fb_bravo' : 'fb_yes';
    banner('good', App.T(k, lang));
    sayFeedback(k);
    setTimeout(next, 1250);
  }

  function phaseDim(p) {
    if (p === 'discover' || p === 'practice') return 'recognition';
    if (p === 'decode') return 'sound';
    return 'reading';
  }

  function next() {
    idx++;
    render();
  }

  /* ---------- Erreur : jamais de "faux" ---------- */

  function miss(step, node, grid) {
    if (busy) return;
    tries++;
    missed++;
    App.Audio.sfx.soft();
    if (node && node.classList) {
      node.classList.add('shake');
      setTimeout(function () { node.classList.remove('shake'); }, 420);
    }

    if (tries === 1) {
      banner('soft', App.T('fb_again', lang));
      /* "Essaie encore. Ecoute bien." puis on refait entendre le materiel. */
      sayFeedback('fb_again').then(function () { replay(step); });
      return;
    }

    if (tries === 2 && step.scaffold && step.scaffold.length) {
      banner('soft', App.T('fb_slower', lang));
      sayFeedback('fb_slower').then(function () { scaffold(step); });
      return;
    }

    banner('soft', App.T('fb_listen', lang));
    /* L'aide, c'est reentendre la consigne en entier, puis le materiel. */
    sayFeedback('fb_listen')
      .then(function () { return spoken ? spoken() : null; })
      .then(function () { replay(step); });
    reduce(step, grid);
  }

  /* Retour parle : fichier d'abord, synthese en repli */
  function sayFeedback(key) {
    var k = lang + ':instruction:' + App.Audio.slugify(key);
    return App.Audio.play(k).catch(function () {});
  }

  /* Rejoue l'element sonore central de l'etape */
  function replay(step) {
    setTimeout(function () {
      if (step.phonemeKey) App.Audio.play(step.phonemeKey);
      else if (step.audioKey) App.Audio.play(step.audioKey);
      else if (step.resultKey) App.Audio.play(step.resultKey);
      else if (step.say) App.Audio.speak(step.say.text, step.say.lang);
      else if (step.word && step.word.t) App.Audio.speak(step.word.t, lang);
    }, 520);
  }

  /* Retire une mauvaise reponse, en gardant toujours deux boutons */
  function reduce(step, grid) {
    if (!grid) grid = taskEl.querySelector('.choices');
    if (!grid) return;
    var all = [].slice.call(grid.querySelectorAll('.choice'));
    var alive = all.filter(function (n) { return !n.classList.contains('is-off'); });
    if (alive.length <= 2) return;
    for (var i = 0; i < alive.length; i++) {
      /* On ne retire JAMAIS la bonne reponse : elle est marquee des sa
         creation, pas seulement une fois qu'elle a ete cliquee. */
      if (alive[i].getAttribute('data-ok') !== '1') {
        alive[i].classList.add('is-off');
        return;
      }
    }
  }

  /* ---------- ETAYAGE : on redescend la marche (§16) ---------- */

  function scaffold(step) {
    busy = true;
    var overlay = el('div', 'scaffold');
    var card = el('div', 'scaffold__card');
    card.appendChild(el('div', 'scaffold__t', App.T('fb_slower', lang)));

    var row = el('div', 'scaffold__row');
    var nodes = step.scaffold.map(function (key) {
      var label = key.split(':').pop().toUpperCase();
      var n = el('div', 'scaffold__p read', label);
      row.appendChild(n);
      return n;
    });
    card.appendChild(row);
    overlay.appendChild(card);
    taskEl.appendChild(overlay);

    var i = 0, finished = false;

    function done() {
      if (finished) return;
      finished = true;
      if (overlay.parentNode) overlay.remove();
      busy = false;
      tries = 2;
      rebuild(step);
    }

    function chain() {
      if (i >= step.scaffold.length) { setTimeout(done, 700); return; }
      var n = nodes[i];
      n.classList.add('is-on');
      var k = step.scaffold[i];
      i++;
      App.Audio.play(k).then(function () { setTimeout(chain, 320); },
                             function () { setTimeout(chain, 320); });
    }
    chain();

    /* Quoi qu'il arrive du cote audio, on rend la main a l'enfant. */
    setTimeout(done, 1600 + step.scaffold.length * 2200);
  }

  /* Apres l'etayage on redessine l'etape, jamais a l'identique :
     les distracteurs sont reduits. */
  function rebuild(step) {
    taskEl.innerHTML = '';
    App.Activities.render(step, ctx(step));
    var grid = taskEl.querySelector('.choices');
    if (grid) reduce(step, grid);
  }

  /* ---------- Bandeau de retour ---------- */

  function banner(kind, text) {
    var old = taskEl.querySelector('.fb');
    if (old) old.remove();
    var b = el('div', 'fb fb--' + kind, text);
    taskEl.appendChild(b);
    setTimeout(function () { if (b.parentNode) b.remove(); }, 1400);
  }

  /* ---------- Fin de mission ---------- */

  function finish() {
    if (m.practice) App.State.addTime(lang, Math.round((Date.now() - t0) / 1000));
    else App.State.finishMission(m.id, lang, stars, Date.now() - t0);

    var newBook = null;
    if (m.unlocksBook && !m.practice) {
      newBook = App.State.unlockBook(m.unlocksBook) ? m.unlocksBook : null;
    }
    var gained = App.Rewards.check(m, lang);

    taskEl.innerHTML = '';
    bar.innerHTML = '';
    phaseEl.textContent = App.T('ph_reward', lang);

    var f = el('div', 'finish');
    f.appendChild(el('div', 'finish__ico', '\ud83c\udf1f'));
    f.appendChild(el('div', 'finish__t', App.T('missionDoneTitle', lang)));
    f.appendChild(el('div', 'finish__s', App.T('youLearned', lang) + ' : ' +
      (m.steps[m.steps.length - 1].learned || m.learned || m.title)));

    var st = el('div', 'finish__stars');
    for (var i = 0; i < 3; i++) {
      st.appendChild(el('span', 'finish__star' + (i < starTier() ? ' is-on' : ''), '\u2b50'));
    }
    f.appendChild(st);
    taskEl.appendChild(f);

    if (gained && gained.length) {
      gained.forEach(function (g) {
        var r = el('div', 'gain');
        r.appendChild(el('span', 'gain__i', g.icon));
        r.appendChild(el('span', 'gain__t', g.label));
        taskEl.appendChild(r);
      });
      App.Audio.sfx.unlock();
    } else {
      App.Audio.sfx.great();
    }

    if (newBook) {
      var b = DATA.books.filter(function (x) { return x.id === newBook; })[0];
      var bk = el('div', 'newbook');
      bk.appendChild(el('div', 'newbook__l', App.T('bookUnlocked', lang)));
      bk.appendChild(el('div', 'newbook__c', b.cover));
      bk.appendChild(el('div', 'newbook__t read', b.title));
      var open = el('button', 'btn btn--primary btn--block', App.T('readItNow', lang));
      open.addEventListener('click', function () {
        box.hidden = true;
        App.UI.openBook(b);
      });
      bk.appendChild(open);
      taskEl.appendChild(bk);
      App.Audio.ui(lang, 'newbook');
    } else {
      App.Audio.ui(lang, 'welldone');
    }

    var back = el('button', 'btn ' + (newBook ? 'btn--quiet' : 'btn--primary') + ' btn--block',
      newBook ? App.T('laterBook', lang) : App.T('backHome', lang));
    back.addEventListener('click', quit);
    taskEl.appendChild(back);
  }

  function starTier() {
    var total = m.steps.length;
    var ratio = stars / Math.max(1, total);
    return ratio > 0.85 ? 3 : ratio > 0.6 ? 2 : 1;
  }

  return {
    mount: mount, start: start, quit: quit, byId: byId,
    /* Utilise par la batterie de tests : ouvrir une etape precise. */
    _goto: function (id, i) { if (start(id)) { idx = i; render(); } }
  };
})();

</script>
<script>
/* ===== js/ui.js ===== */
/* =========================================================
   js/ui.js — Les ecrans de l'enfant

   Regle de localisation (§9) : tout ce qui est affiche ici passe par
   T(), et T() suit la langue du jour. L'interface enfant n'est jamais
   melangee.
   ========================================================= */

window.App = window.App || {};

App.UI = (function () {

  var screens = {}, tabs = {}, cur = 'home';
  var mapLang = null;

  function el(t, c, x) {
    var n = document.createElement(t);
    if (c) n.className = c;
    if (x != null) n.textContent = x;
    return n;
  }
  function T(k) { return App.T(k, App.State.lang()); }
  function lod() { return App.State.lang(); }

  /* ---------- Montage ---------- */

  function mount() {
    ['home', 'map', 'train', 'books', 'stars'].forEach(function (k) {
      screens[k] = document.getElementById('screen-' + k);
      tabs[k] = document.getElementById('tab-' + k);
      tabs[k].addEventListener('click', function () { go(k); });
    });
    document.getElementById('sheetClose').addEventListener('click', closeSheet);
    go('home');
  }

  function go(k) {
    cur = k;
    for (var n in screens) {
      screens[n].hidden = n !== k;
      tabs[n].classList.toggle('is-active', n === k);
    }
    refresh();
  }

  function refresh() {
    var lang = lod();
    document.documentElement.setAttribute('data-lang', lang === 'free' ? 'fr' : lang);
    drawTop();
    if (cur === 'home') drawHome();
    if (cur === 'map') drawMap();
    if (cur === 'train') drawTrain();
    if (cur === 'books') drawBooks();
    if (cur === 'stars') drawStars();
    drawTabs();
  }

  function drawTabs() {
    tabs.home.querySelector('.tab__lbl').textContent = T('home');
    tabs.map.querySelector('.tab__lbl').textContent = T('myJourney');
    tabs.train.querySelector('.tab__lbl').textContent = T('myTraining');
    tabs.books.querySelector('.tab__lbl').textContent = T('myBooks');
    tabs.stars.querySelector('.tab__lbl').textContent = T('myStars');
  }

  function drawTop() {
    var s = App.State.get();
    document.getElementById('tbAvatar').textContent = App.Rewards.avatarIcon();
    document.getElementById('tbHello').textContent = T('hello');
    document.getElementById('tbName').textContent = s.child.name;
    document.getElementById('tbStars').textContent = '\u2b50 ' + s.stars;
  }

  /* ---------- ACCUEIL ---------- */

  function drawHome() {
    var box = screens.home;
    box.innerHTML = '';

    /* Tant qu'Alexis n'a pas choisi aujourd'hui, on ne decide pas a sa
       place : le choix de la langue EST l'ecran d'accueil (§1). */
    if (!App.State.hasChosen()) return drawChooser(box);

    var lang = lod();
    var next = App.Engine.next(lang);

    /* MA SEANCE : l'action principale, composee a l'instant (§10) */
    var plan = App.Session.plan(lang);
    var hero = el('section', 'today');
    hero.appendChild(el('div', 'today__label', T('mySession')));
    hero.appendChild(el('div', 'today__flag', lang === 'en' ? '\ud83c\uddec\ud83c\udde7' : '\ud83c\uddeb\ud83c\uddf7'));
    hero.appendChild(el('h1', 'today__title', T('todayTitle')));

    var pl = el('div', 'plan');
    plan.parts.forEach(function (p) {
      var r = el('div', 'plan__r');
      r.appendChild(el('span', 'plan__i', p.icon));
      var mid = el('span', 'plan__m');
      mid.appendChild(el('span', 'plan__t', p.label));
      if (p.sub) mid.appendChild(el('span', 'plan__s', p.sub));
      r.appendChild(mid);
      r.appendChild(el('span', 'plan__k', T('part_' + p.kind)));
      pl.appendChild(r);
    });
    hero.appendChild(pl);
    hero.appendChild(el('div', 'today__mins', '\u23f1 ' + plan.minutes + ' min'));

    var cta = el('button', 'btn btn--big btn--block today__cta', T('start') + '  \u2192');
    cta.addEventListener('click', function () {
      if (!App.Session.start(lang)) go('map');
    });
    hero.appendChild(cta);
    box.appendChild(hero);

    /* Ma prochaine etape */
    if (next) {
      var c = el('section', 'card');
      c.appendChild(el('div', 'eyebrow', T('nextStep')));
      var nu = el('div', 'nextup');
      nu.appendChild(el('div', 'nextup__ico', next.icon));
      var mid = el('div', '');
      mid.appendChild(el('div', 'nextup__t', T('mission') + ' ' + next.n + ' \u00b7 ' + next.title));
      mid.appendChild(el('div', 'nextup__s', next.subtitle || ''));
      nu.appendChild(mid);
      nu.appendChild(el('div', 'nextup__go', '\u203a'));
      c.appendChild(nu);

      var bar = el('div', 'bar');
      var fill = el('div', 'bar__fill');
      fill.style.width = App.Engine.playableProgress(lang) + '%';
      bar.appendChild(fill);
      c.appendChild(bar);
      c.addEventListener('click', function () { go('map'); });
      box.appendChild(c);
    }

    /* Mon livre */
    var book = firstOpenBook(lang);
    var soon = !book ? DATA.books.filter(function (b) { return b.lang === lang; })[0] : null;
    var show = book || soon;
    if (show) {
      var bc = el('section', 'card');
      bc.appendChild(el('div', 'eyebrow', T('myBook')));
      var bh = el('div', 'bookhero');
      bh.appendChild(el('div', 'bookhero__cover', book ? show.cover : '\ud83d\udd12'));
      var bm = el('div', '');
      bm.appendChild(el('div', 'nextup__t read', show.title));
      bm.appendChild(el('div', 'nextup__s', book ? T('bookWaiting') : T('bookSoon')));
      bh.appendChild(bm);
      bh.appendChild(el('div', 'nextup__go', '\u203a'));
      bc.appendChild(bh);
      if (!book) bc.style.opacity = '.6';
      bc.addEventListener('click', function () { if (book) openBook(book); else go('books'); });
      box.appendChild(bc);
    }

    /* On peut toujours changer d'avis, a tout moment (§1) */
    var sw = el('button', 'langswap');
    sw.appendChild(el('span', 'langswap__f', lang === 'en' ? '\ud83c\uddeb\ud83c\uddf7' : '\ud83c\uddec\ud83c\udde7'));
    sw.appendChild(el('span', 'langswap__t', T('switchLang')));
    sw.addEventListener('click', function () {
      App.State.setLang(lang === 'en' ? 'fr' : 'en');
      App.Audio.sfx.pop();
      mapLang = null;
      refresh();
    });
    box.appendChild(sw);

    var pk = el('button', 'parentkey', '\ud83d\udd12 ' + T('parentSpace'));
    pk.addEventListener('click', function () { App.Parent.askUnlock(); });
    box.appendChild(pk);
  }

  /* ---------- Le choix de la langue ---------- */

  function drawChooser(box) {
    var sug = App.State.suggested();
    var c = el('section', 'chooser');
    c.appendChild(el('div', 'chooser__hi', 'Bonjour ' + App.State.get().child.name + ' \u00b7 Hello!'));
    c.appendChild(el('h1', 'chooser__t', App.T('chooseTitle', 'fr')));
    c.appendChild(el('div', 'chooser__t2', App.T('chooseTitle', 'en')));

    var row = el('div', 'chooser__row');
    [['fr', '\ud83c\uddeb\ud83c\uddf7', 'Fran\u00e7ais'], ['en', '\ud83c\uddec\ud83c\udde7', 'English']].forEach(function (p) {
      var b = el('button', 'langbig lang-' + p[0] + (sug === p[0] ? ' is-sug' : ''));
      b.appendChild(el('span', 'langbig__f', p[1]));
      b.appendChild(el('span', 'langbig__n', p[2]));
      var done = App.State.missionsDone(p[0]);
      var nx = App.Engine.next(p[0]);
      b.appendChild(el('span', 'langbig__s', done
        ? done + ' \u2b50'
        : (nx ? App.T('mission', p[0]) + ' 1' : '')));
      b.addEventListener('click', function () {
        App.State.setLang(p[0]);
        App.Audio.sfx.unlock();
        mapLang = null;
        refresh();
      });
      row.appendChild(b);
    });
    c.appendChild(row);
    box.appendChild(c);

    var pk = el('button', 'parentkey', '\ud83d\udd12 Espace parent');
    pk.addEventListener('click', function () { App.Parent.askUnlock(); });
    box.appendChild(pk);
  }

  function firstOpenBook(lang) {
    var list = DATA.books.filter(function (b) {
      return b.lang === lang && App.State.isBookUnlocked(b.id);
    });
    var unread = list.filter(function (b) { return App.State.get().booksRead.indexOf(b.id) < 0; });
    return unread[0] || list[0] || null;
  }

  /* ---------- MON AVENTURE : la carte des missions ---------- */

  function drawMap() {
    var box = screens.map;
    box.innerHTML = '';
    var lang = mapLang || lod();
    if (lang === 'free') lang = 'fr';

    var sw = el('div', 'switch');
    [['fr', '\ud83c\uddeb\ud83c\uddf7'], ['en', '\ud83c\uddec\ud83c\udde7']].forEach(function (p) {
      var b = el('button', p[0] === lang ? 'is-on' : '', p[1] + ' ' + App.T('langName', p[0]));
      b.addEventListener('click', function () { mapLang = p[0]; drawMap(); });
      sw.appendChild(b);
    });
    box.appendChild(sw);

    var head = el('div', 'maphead');
    head.appendChild(el('div', 'maphead__n',
      App.State.missionsDone(lang) + ' / ' + App.Engine.all(lang).length + ' ' + App.T('missionsIn', lang)));
    var bar = el('div', 'bar');
    var fill = el('div', 'bar__fill');
    fill.style.width = App.Engine.progress(lang) + '%';
    bar.appendChild(fill);
    head.appendChild(bar);
    box.appendChild(head);

    var trail = el('div', 'trail');
    App.Engine.worlds(lang).forEach(function (grp) {
      var w = el('div', 'wblock');
      var wh = el('div', 'wblock__h');
      wh.appendChild(el('span', 'wblock__i', grp.world.icon));
      var wt = el('div', '');
      wt.appendChild(el('div', 'wblock__t', App.T('world', lang) + ' ' + grp.world.n + ' \u2014 ' + grp.world.title));
      wt.appendChild(el('div', 'wblock__s', grp.world.sub));
      wh.appendChild(wt);
      w.appendChild(wh);

      var list = el('div', 'mlist');
      grp.missions.forEach(function (mi) {
        var st = App.Engine.status(mi);
        var n = el('button', 'mnode is-' + st);
        n.appendChild(el('span', 'mnode__n', String(mi.n)));
        var mid = el('span', 'mnode__m');
        mid.appendChild(el('span', 'mnode__t', mi.title));
        mid.appendChild(el('span', 'mnode__s', mi.subtitle || ''));
        n.appendChild(mid);
        n.appendChild(el('span', 'mnode__b',
          st === 'done' ? '\u2b50' : st === 'now' ? '\u25b6' : st === 'soon' ? '\u23f3' : '\ud83d\udd12'));
        n.addEventListener('click', function () { openMission(mi, st, lang); });
        list.appendChild(n);
      });
      w.appendChild(list);
      trail.appendChild(w);
    });
    box.appendChild(trail);
  }

  function openMission(mi, st, lang) {
    var body = el('div', '');
    body.appendChild(el('div', 'sheet__ico', mi.icon));
    body.appendChild(el('h3', 'sheet__t', App.T('mission', lang) + ' ' + mi.n + ' \u00b7 ' + mi.title));
    body.appendChild(el('div', 'sheet__s', mi.subtitle || ''));

    if (st === 'locked') {
      body.appendChild(el('div', 'note', App.T('missionLocked', lang)));
    } else if (st === 'soon') {
      body.appendChild(el('div', 'note', lang === 'fr'
        ? 'Cette mission arrive bient\u00f4t.' : 'This mission is coming soon.'));
    } else {
      if (mi.learned) body.appendChild(el('div', 'note', mi.learned));
      body.appendChild(el('div', 'sheet__meta', mi.steps.length + ' \u00b7 ' + App.T('stepOf', lang)));
      var go2 = el('button', 'btn btn--primary btn--block',
        st === 'done' ? App.T('replayMission', lang) : App.T('startMission', lang));
      go2.addEventListener('click', function () {
        closeSheet();
        App.Mission.start(mi);
      });
      body.appendChild(go2);
    }
    showSheet(body);
  }

  /* ---------- JE M'ENTRAINE ---------- */

  function drawTrain() {
    var box = screens.train;
    box.innerHTML = '';
    var lang = lod();
    box.appendChild(el('h2', 'stitle', T('myTraining')));

    var cat = App.Practice.catalogue(lang);
    if (!cat.length) {
      box.appendChild(el('div', 'note', T('trainEmpty')));
      return;
    }

    /* Ce qu'il faut retravailler d'abord : rouge, puis orange. */
    var weak = cat.filter(function (c) { return c.state !== 'green'; });
    var solid = cat.filter(function (c) { return c.state === 'green'; });

    if (weak.length) {
      box.appendChild(el('div', 'eyebrow', T('toReview')));
      box.appendChild(chips(weak, lang));
    }
    if (solid.length) {
      box.appendChild(el('div', 'eyebrow', T('toKeep')));
      box.appendChild(chips(solid, lang));
    }
  }

  function chips(list, lang) {
    var g = el('div', 'chips');
    list.forEach(function (c) {
      var b = el('button', 'chip chip--' + c.state);
      b.appendChild(el('span', 'chip__d', App.Skills.dot(c.skill.id)));
      b.appendChild(el('span', 'chip__l read', c.skill.label));
      b.addEventListener('click', function () {
        var s = App.Practice.session(c.skill);
        if (s) App.Mission.start(s);
      });
      g.appendChild(b);
    });
    return g;
  }

  /* ---------- MES LIVRES ---------- */

  function drawBooks() {
    var box = screens.books;
    box.innerHTML = '';
    box.appendChild(el('h2', 'stitle', T('myBooks')));
    var read = App.State.get().booksRead;

    [['fr', T('booksFr')], ['en', T('booksEn')]].forEach(function (p) {
      var all = DATA.books.filter(function (b) { return b.lang === p[0]; });
      var groups = [
        { label: T('booksAvailable'), list: all.filter(function (b) {
            return App.State.isBookUnlocked(b.id) && read.indexOf(b.id) < 0; }) },
        { label: T('booksDone'), list: all.filter(function (b) {
            return read.indexOf(b.id) >= 0; }) },
        { label: T('locked'), list: all.filter(function (b) {
            return !App.State.isBookUnlocked(b.id); }) }
      ];
      box.appendChild(el('div', 'langhead', (p[0] === 'fr' ? '\ud83c\uddeb\ud83c\uddf7 ' : '\ud83c\uddec\ud83c\udde7 ') + p[1]));
      var any = false;
      groups.forEach(function (g) {
        if (!g.list.length) return;
        any = true;
        box.appendChild(el('div', 'eyebrow', g.label));
        var shelf = el('div', 'shelf');
        g.list.forEach(function (b) {
          var open = App.State.isBookUnlocked(b.id);
          var done = read.indexOf(b.id) >= 0;
          var c = el('button', 'book' + (open ? '' : ' is-locked'));
          c.appendChild(el('div', 'book__c', open ? b.cover : '\ud83d\udd12'));
          c.appendChild(el('div', 'book__t read', b.title));
          c.appendChild(el('div', 'book__s', open
            ? (done ? '\u2713 ' + T('bookDone') : T('bookOpen'))
            : (b.needs || T('bookLocked'))));
          c.addEventListener('click', function () { if (open) openBook(b); });
          shelf.appendChild(c);
        });
        box.appendChild(shelf);
      });
      if (!any) box.appendChild(el('div', 'note', T('booksNone')));
    });
  }

  /* ---------- LECTEUR DE LIVRE (§22 : lire d'abord, voir ensuite) ---------- */

  function openBook(b, then) {
    var r = document.getElementById('reader');
    var lang = b.lang;
    var i = 0;
    r.hidden = false;
    draw();

    function draw() {
      r.innerHTML = '';
      var bar = el('div', 'rbar');
      var q = el('button', 'rbar__quit', '\u2715');
      q.addEventListener('click', close);
      bar.appendChild(q);
      bar.appendChild(el('div', 'rbar__t', b.title));
      bar.appendChild(el('div', 'rbar__n', (i + 1) + '/' + b.pages.length));
      r.appendChild(bar);

      var p = b.pages[i];
      var page = el('div', 'page');
      var line = el('div', 'page__text read');
      p.text.split(' ').forEach(function (w) {
        var s = el('span', 'page__w', w);
        s.addEventListener('click', function () {
          s.classList.add('is-on');
          App.Audio.speak(w.replace(/[.!?,]/g, ''), lang);
          setTimeout(function () { s.classList.remove('is-on'); }, 700);
        });
        line.appendChild(s);
      });
      page.appendChild(line);

      var img = el('div', 'page__img is-hidden', '\u2753');
      page.appendChild(img);
      r.appendChild(page);

      var read = el('button', 'btn btn--primary btn--block', App.T('iReadIt', lang));
      read.addEventListener('click', function () {
        img.textContent = p.e;
        img.classList.remove('is-hidden');
        App.Audio.speak(p.text, lang);
        read.remove();
        var nx = el('button', 'btn btn--primary btn--block',
          i < b.pages.length - 1 ? App.T('turnPage', lang) : App.T('finish', lang));
        nx.addEventListener('click', function () {
          i++;
          if (i < b.pages.length) draw();
          else end();
        });
        r.appendChild(nx);
      });
      r.appendChild(read);

      var hear = el('button', 'btn btn--quiet btn--block', App.T('listen', lang));
      hear.addEventListener('click', function () { App.Audio.speak(p.text, lang); });
      r.appendChild(hear);
    }

    function end() {
      r.innerHTML = '';
      var first = App.State.markBookRead(b.id);
      var gained = App.Rewards.check();
      if (first) App.State.remember('\ud83d\udcd6', b.title);

      var f = el('div', 'finish');
      f.appendChild(el('div', 'finish__ico', '\ud83d\udcd6'));
      f.appendChild(el('div', 'finish__t', App.T('theEnd', lang)));
      f.appendChild(el('div', 'finish__s', b.title));
      r.appendChild(f);

      (gained || []).forEach(function (g) {
        var n = el('div', 'gain');
        n.appendChild(el('span', 'gain__i', g.icon));
        n.appendChild(el('span', 'gain__t', g.label));
        r.appendChild(n);
      });
      App.Audio.sfx.great();

      var back = el('button', 'btn btn--primary btn--block', App.T('backHome', lang));
      back.addEventListener('click', close);
      r.appendChild(back);
    }

    function close() {
      App.Audio.stop();
      r.hidden = true;
      var f = then; then = null;
      if (f) f(); else refresh();
    }
  }

  /* ---------- MES ETOILES ---------- */

  function drawStars() {
    var box = screens.stars;
    box.innerHTML = '';
    var s = App.State.get();

    box.appendChild(el('h2', 'stitle', T('myStars')));

    /* Mon personnage */
    var c1 = el('section', 'card');
    c1.appendChild(el('div', 'eyebrow', T('myCharacter')));
    var hero = el('div', 'charhero');
    hero.appendChild(el('div', 'charhero__a', App.Rewards.avatarIcon()));
    var acc = s.child.accessory;
    if (acc) {
      var a = DATA.accessories.filter(function (x) { return x.id === acc; })[0];
      if (a) hero.appendChild(el('div', 'charhero__acc', a.icon));
    }
    c1.appendChild(hero);

    var row = el('div', 'picker');
    DATA.avatars.forEach(function (a) {
      var ok = App.Rewards.avatarUnlocked(a);
      var b = el('button', 'pick' + (s.child.avatar === a.id ? ' is-on' : '') + (ok ? '' : ' is-locked'),
        ok ? a.icon : '\ud83d\udd12');
      b.addEventListener('click', function () {
        if (!ok) return;
        s.child.avatar = a.id; App.State.save(); App.Audio.sfx.pop(); drawStars(); drawTop();
      });
      row.appendChild(b);
    });
    c1.appendChild(row);

    var row2 = el('div', 'picker');
    var none = el('button', 'pick' + (!acc ? ' is-on' : ''), '\u2716');
    none.addEventListener('click', function () { s.child.accessory = null; App.State.save(); drawStars(); });
    row2.appendChild(none);
    DATA.accessories.forEach(function (a) {
      var ok = App.Rewards.accessoryUnlocked(a);
      var b = el('button', 'pick' + (acc === a.id ? ' is-on' : '') + (ok ? '' : ' is-locked'),
        ok ? a.icon : '\ud83d\udd12');
      b.addEventListener('click', function () {
        if (!ok) return;
        s.child.accessory = a.id; App.State.save(); App.Audio.sfx.pop(); drawStars();
      });
      row2.appendChild(b);
    });
    c1.appendChild(row2);
    box.appendChild(c1);

    /* Mes trophees */
    var c2 = el('section', 'card');
    c2.appendChild(el('div', 'eyebrow', T('myTrophies')));
    var got = DATA.trophies.filter(App.Rewards.trophyOwned);
    var left = DATA.trophies.filter(function (t) { return !App.Rewards.trophyOwned(t); });

    if (got.length) {
      var g = el('div', 'badges');
      got.forEach(function (t) {
        var b = el('div', 'badge');
        b.appendChild(el('div', 'badge__i', t.icon));
        b.appendChild(el('div', 'badge__t', t.label));
        g.appendChild(b);
      });
      c2.appendChild(g);
    } else {
      c2.appendChild(el('div', 'note', T('albumEmpty')));
    }

    /* On ne montre pas un mur de cadenas (§27) : juste la prochaine
       recompense a atteindre, avec ce qu'il faut faire pour l'avoir. */
    if (left.length) {
      var nxt = el('div', 'nextreward');
      nxt.appendChild(el('span', 'nextreward__i', '\ud83d\udd12'));
      var m = el('div', '');
      m.appendChild(el('div', 'nextreward__t', T('toEarn') + ' \u00b7 ' + left[0].label));
      m.appendChild(el('div', 'nextreward__s', left[0].hint));
      nxt.appendChild(m);
      c2.appendChild(nxt);
      if (left.length > 1) c2.appendChild(el('div', 'note', '+ ' + (left.length - 1) + ' \u00b7 ' + T('toEarn').toLowerCase()));
    }
    box.appendChild(c2);

    /* Mes livres termines */
    var c3 = el('section', 'card');
    c3.appendChild(el('div', 'eyebrow', T('myFinished')));
    if (!s.booksRead.length) {
      c3.appendChild(el('div', 'note', T('albumEmpty')));
    } else {
      var sh = el('div', 'shelf shelf--mini');
      s.booksRead.forEach(function (id) {
        var b = DATA.books.filter(function (x) { return x.id === id; })[0];
        if (!b) return;
        var n = el('div', 'book');
        n.appendChild(el('div', 'book__c', b.cover));
        n.appendChild(el('div', 'book__t read', b.title));
        sh.appendChild(n);
      });
      c3.appendChild(sh);
    }
    box.appendChild(c3);

    /* Mon album : les moments qui comptent */
    var c4 = el('section', 'card');
    c4.appendChild(el('div', 'eyebrow', T('myAlbum')));
    if (!s.album.length) {
      c4.appendChild(el('div', 'note', T('albumEmpty')));
    } else {
      var al = el('div', 'album');
      s.album.forEach(function (a) {
        var n = el('div', 'album__i');
        n.appendChild(el('span', 'album__e', a.icon));
        n.appendChild(el('span', 'album__l', a.label));
        n.appendChild(el('span', 'album__d', a.date));
        al.appendChild(n);
      });
      c4.appendChild(al);
    }
    box.appendChild(c4);
  }

  /* ---------- Feuille modale ---------- */

  function showSheet(node) {
    var sh = document.getElementById('sheet');
    var body = document.getElementById('sheetBody');
    body.innerHTML = '';
    body.appendChild(node);
    sh.hidden = false;
  }
  function closeSheet() { document.getElementById('sheet').hidden = true; }

  return {
    mount: mount, go: go, refresh: refresh,
    openBook: openBook, closeSheet: closeSheet
  };
})();

</script>
<script>
/* ===== js/parent.js ===== */
/* =========================================================
   js/parent.js — Espace parent

   Toujours en francais : il s'adresse a Sophie, pas a Alexis.
   Objectif (§23, §24) : comprendre en dix secondes ou en est
   l'enfant, et surtout CE QU'IL FAUT RENFORCER.
   ========================================================= */

window.App = window.App || {};

App.Parent = (function () {

  var box, tab = 'overview';

  function el(t, c, x) {
    var n = document.createElement(t);
    if (c) n.className = c;
    if (x != null) n.textContent = x;
    return n;
  }

  /* ---------- Verrou : une multiplication simple ---------- */

  function askUnlock() {
    var lock = document.getElementById('plock');
    var a = 3 + Math.floor(Math.random() * 6);
    var b = 4 + Math.floor(Math.random() * 6);
    var want = a * b, typed = '';

    lock.innerHTML = '';
    lock.hidden = false;
    var card = el('div', 'plock__card');
    card.appendChild(el('div', 'plock__h', 'Espace parent'));
    card.appendChild(el('div', 'plock__q', a + ' \u00d7 ' + b + ' = ?'));
    var out = el('div', 'plock__out', '');
    card.appendChild(out);

    var pad = el('div', 'plock__pad');
    ['1','2','3','4','5','6','7','8','9','\u2190','0','OK'].forEach(function (k) {
      var btn = el('button', 'plock__k', k);
      btn.addEventListener('click', function () {
        if (k === '\u2190') typed = typed.slice(0, -1);
        else if (k === 'OK') {
          if (parseInt(typed, 10) === want) { lock.hidden = true; open(); }
          else {
            typed = '';
            card.classList.add('shake');
            setTimeout(function () { card.classList.remove('shake'); }, 400);
          }
        } else if (typed.length < 3) typed += k;
        out.textContent = typed;
      });
      pad.appendChild(btn);
    });
    card.appendChild(pad);

    var cancel = el('button', 'btn btn--quiet btn--block', 'Annuler');
    cancel.addEventListener('click', function () { lock.hidden = true; });
    card.appendChild(cancel);
    lock.appendChild(card);
  }

  /* ---------- Coque ---------- */

  function open() {
    box = document.getElementById('parent');
    box.hidden = false;
    draw();
  }
  function close() {
    document.getElementById('parent').hidden = true;
    App.UI.refresh();
  }

  function draw() {
    box.innerHTML = '';
    var head = el('div', 'phead');
    var back = el('button', 'phead__x', '\u2715');
    back.addEventListener('click', close);
    head.appendChild(back);
    head.appendChild(el('div', 'phead__t', 'Espace parent'));
    head.appendChild(el('div', 'phead__s', App.State.get().child.name));
    box.appendChild(head);

    var tabs = el('div', 'ptabs');
    [['overview', 'Vue d\u2019ensemble'], ['fr', 'Fran\u00e7ais'], ['en', 'English'],
     ['skills', 'Comp\u00e9tences'], ['plan', 'Langue'], ['set', 'Voix']]
      .forEach(function (p) {
        var b = el('button', 'ptab' + (tab === p[0] ? ' is-on' : ''), p[1]);
        b.addEventListener('click', function () { tab = p[0]; draw(); });
        tabs.appendChild(b);
      });
    box.appendChild(tabs);

    var body = el('div', 'pbody');
    box.appendChild(body);

    if (tab === 'overview') drawOverview(body);
    if (tab === 'fr') drawLang(body, 'fr');
    if (tab === 'en') drawLang(body, 'en');
    if (tab === 'skills') drawSkills(body);
    if (tab === 'plan') drawPlan(body);
    if (tab === 'set') drawSettings(body);
  }

  function mins(sec) { return Math.round((sec || 0) / 60); }

  function stat(label, value) {
    var n = el('div', 'pstat');
    n.appendChild(el('div', 'pstat__v', String(value)));
    n.appendChild(el('div', 'pstat__l', label));
    return n;
  }

  function row2(l, v) {
    var r = el('div', 'prow');
    r.appendChild(el('span', 'prow__l', l));
    r.appendChild(el('span', 'prow__v', v));
    return r;
  }

  /* ---------- Vue d'ensemble ---------- */

  function drawOverview(b) {
    var s = App.State.get();
    var today = s.days[App.State.today()] || { fr: 0, en: 0 };
    var week = App.State.weekTotals();

    var c0 = el('div', 'pcard');
    c0.appendChild(el('div', 'pcard__h', 'Aujourd\u2019hui'));
    var g0 = el('div', 'pgrid');
    g0.appendChild(stat('\ud83c\uddeb\ud83c\uddf7 Fran\u00e7ais', mins(today.fr) + ' min'));
    g0.appendChild(stat('\ud83c\uddec\ud83c\udde7 English', mins(today.en) + ' min'));
    c0.appendChild(g0);
    b.appendChild(c0);

    var c1 = el('div', 'pcard');
    c1.appendChild(el('div', 'pcard__h', 'Cette semaine'));
    var g1 = el('div', 'pgrid');
    g1.appendChild(stat('\ud83c\uddeb\ud83c\uddf7 Fran\u00e7ais', mins(week.fr) + ' min'));
    g1.appendChild(stat('\ud83c\uddec\ud83c\udde7 English', mins(week.en) + ' min'));
    g1.appendChild(stat('R\u00e9gularit\u00e9', s.streak + ' j'));
    g1.appendChild(stat('Missions', App.State.missionsDone('fr') + App.State.missionsDone('en')));
    c1.appendChild(g1);
    b.appendChild(c1);

    var c2 = el('div', 'pcard');
    c2.appendChild(el('div', 'pcard__h', 'O\u00f9 en est Alexis'));
    c2.appendChild(el('p', 'ptext', App.Engine.narrative('fr')));
    c2.appendChild(el('p', 'ptext', App.Engine.narrative('en')));
    b.appendChild(c2);

    var c3 = el('div', 'pcard pcard--warn');
    c3.appendChild(el('div', 'pcard__h', '\u00c0 renforcer'));
    var weak = App.Engine.toReinforce('fr').concat(App.Engine.toReinforce('en')).slice(0, 5);
    if (!weak.length) {
      c3.appendChild(el('div', 'ptext', 'Rien ne bloque pour l\u2019instant. Continuez au rythme actuel.'));
    } else {
      weak.forEach(function (w) { c3.appendChild(row2(w.label, w.score + '%')); });
    }
    b.appendChild(c3);
  }

  /* ---------- Une langue ---------- */

  function drawLang(b, lang) {
    var name = lang === 'fr' ? 'Fran\u00e7ais' : 'English';
    var c = el('div', 'pcard');
    c.appendChild(el('div', 'pcard__h', name));
    var bar = el('div', 'bar');
    var fill = el('div', 'bar__fill');
    fill.style.width = App.Engine.progress(lang) + '%';
    bar.appendChild(fill);
    c.appendChild(bar);
    c.appendChild(el('div', 'ptext', App.Engine.narrative(lang)));
    b.appendChild(c);

    var c2 = el('div', 'pcard');
    c2.appendChild(el('div', 'pcard__h', 'Missions'));
    App.Engine.all(lang).forEach(function (m) {
      var st = App.Engine.status(m);
      c2.appendChild(row2(m.n + '. ' + m.title,
        st === 'done' ? '\u2b50 termin\u00e9e'
        : st === 'now' ? 'en cours'
        : st === 'soon' ? '\u00e0 venir' : 'verrouill\u00e9e'));
    });
    b.appendChild(c2);

    var c3 = el('div', 'pcard');
    c3.appendChild(el('div', 'pcard__h', '\u00c0 renforcer en ' + name.toLowerCase()));
    var weak = App.Engine.toReinforce(lang);
    if (!weak.length) c3.appendChild(el('div', 'ptext', 'Aucun point fragile identifi\u00e9.'));
    else weak.slice(0, 6).forEach(function (w) { c3.appendChild(row2(w.label, w.score + '%')); });
    b.appendChild(c3);
  }

  /* ---------- Competences ---------- */

  function drawSkills(b) {
    ['fr', 'en'].forEach(function (lang) {
      var c = el('div', 'pcard');
      c.appendChild(el('div', 'pcard__h',
        (lang === 'fr' ? '\ud83c\uddeb\ud83c\uddf7 Progression fran\u00e7aise' : '\ud83c\uddec\ud83c\udde7 Progression anglaise')));

      /* Les grandes familles : ce qu'Alexis apprend, en une ligne chacune */
      App.Skills.groups(lang).forEach(function (g) {
        var r = el('div', 'grow');
        r.appendChild(el('div', 'grow__l', g.label));
        var bar = el('div', 'gbar');
        [['green', g.green], ['orange', g.orange], ['red', g.red]].forEach(function (p) {
          if (!p[1]) return;
          var seg = el('div', 'gbar__s gbar__s--' + p[0]);
          seg.style.width = (p[1] / g.total * 100) + '%';
          bar.appendChild(seg);
        });
        r.appendChild(bar);
        r.appendChild(el('div', 'grow__v', g.green + '/' + g.total));
        c.appendChild(r);
      });
      b.appendChild(c);
    });

    /* Ce qui pose probleme, trié par urgence */
    var c2 = el('div', 'pcard pcard--warn');
    c2.appendChild(el('div', 'pcard__h', 'Comp\u00e9tences \u00e0 revoir'));
    var weak = App.Skills.fragile('fr').concat(App.Skills.fragile('en'))
      .sort(function (a, z) { return z.urgency - a.urgency; }).slice(0, 8);
    if (!weak.length) {
      c2.appendChild(el('div', 'ptext', 'Rien ne bloque. Les comp\u00e9tences travaill\u00e9es tiennent.'));
    } else {
      weak.forEach(function (w) {
        var r = el('div', 'skrow');
        r.appendChild(el('span', 'skrow__d', App.Skills.dot(w.skill.id)));
        var mid = el('div', 'skrow__m');
        mid.appendChild(el('div', 'skrow__l', w.skill.label));
        mid.appendChild(el('div', 'skrow__s', App.Skills.label(w.skill.id) +
          (w.days > 0 ? ' \u00b7 vue il y a ' + w.days + ' j' : ' \u00b7 vue aujourd\u2019hui')));
        r.appendChild(mid);
        r.appendChild(el('span', 'skrow__v', w.score + '%'));
        c2.appendChild(r);
      });
      c2.appendChild(el('div', 'ptext',
        'Ces comp\u00e9tences sont automatiquement r\u00e9inject\u00e9es dans les prochaines ' +
        's\u00e9ances d\u2019Alexis. Il peut aussi les rejouer seul depuis \u00ab Je m\u2019entra\u00eene \u00bb.'));
    }
    b.appendChild(c2);

    /* Le detail, pour qui veut creuser */
    var c3 = el('div', 'pcard');
    c3.appendChild(el('div', 'pcard__h', 'Le d\u00e9tail'));
    ['fr', 'en'].forEach(function (lang) {
      var seen = App.Skills.seen(lang);
      if (!seen.length) return;
      c3.appendChild(el('div', 'eyebrow', lang === 'fr' ? 'Fran\u00e7ais' : 'English'));
      seen.sort(function (a, z) { return App.Skills.score(a.id) - App.Skills.score(z.id); })
        .forEach(function (sk) {
          var r = el('div', 'prow');
          r.appendChild(el('span', 'prow__l', App.Skills.dot(sk.id) + '  ' + sk.label));
          r.appendChild(el('span', 'prow__v', App.Skills.score(sk.id) + '%'));
          c3.appendChild(r);
        });
    });
    b.appendChild(c3);
  }

  /* ---------- Planning ---------- */

  function drawPlan(b) {
    var s = App.State.get();

    var c0 = el('div', 'pcard');
    c0.appendChild(el('div', 'pcard__h', 'Qui choisit la langue ?'));
    c0.appendChild(el('div', 'ptext',
      'Par defaut, Alexis choisit lui-meme a chaque session. Vous pouvez ' +
      'suggerer une langue, mais il pourra toujours prendre l\u2019autre : ' +
      'le systeme ne bloque jamais un choix.'));
    var row = el('div', 'dsw dsw--wide');
    [[null, 'Alexis choisit'], ['fr', '\ud83c\uddeb\ud83c\uddf7 Suggerer FR'], ['en', '\ud83c\uddec\ud83c\udde7 Suggerer EN']]
      .forEach(function (o) {
        var btn = el('button', 'dsw__b' + ((s.settings.preferred || null) === o[0] ? ' is-on' : ''), o[1]);
        btn.addEventListener('click', function () {
          s.settings.preferred = o[0];
          if (o[0]) s.settings.alternate = false;
          App.State.save(); draw();
        });
        row.appendChild(btn);
      });
    c0.appendChild(row);

    var alt = el('button', 'btn btn--quiet btn--block',
      s.settings.alternate ? 'Alternance suggeree : activee' : 'Alternance suggeree : desactivee');
    alt.addEventListener('click', function () {
      s.settings.alternate = !s.settings.alternate;
      if (s.settings.alternate) s.settings.preferred = null;
      App.State.save(); draw();
    });
    c0.appendChild(alt);
    c0.appendChild(el('div', 'ptext',
      'L\u2019alternance ne fait que pre-selectionner la langue du jour sur l\u2019ecran ' +
      'de choix. Elle n\u2019impose rien.'));
    b.appendChild(c0);

    var days = [['1', 'Lundi'], ['2', 'Mardi'], ['3', 'Mercredi'], ['4', 'Jeudi'],
                ['5', 'Vendredi'], ['6', 'Samedi'], ['0', 'Dimanche']];
    var c = el('div', 'pcard');
    c.appendChild(el('div', 'pcard__h', 'Semaine suggeree'));
    days.forEach(function (d) {
      var r = el('div', 'prow');
      r.appendChild(el('span', 'prow__l', d[1]));
      var sw = el('div', 'dsw');
      [['fr', '\ud83c\uddeb\ud83c\uddf7'], ['en', '\ud83c\uddec\ud83c\udde7']].forEach(function (o) {
        var btn = el('button', 'dsw__b' + (s.schedule[d[0]] === o[0] ? ' is-on' : ''), o[1]);
        btn.addEventListener('click', function () { s.schedule[d[0]] = o[0]; App.State.save(); draw(); });
        sw.appendChild(btn);
      });
      r.appendChild(sw);
      c.appendChild(r);
    });
    b.appendChild(c);

    var c2 = el('div', 'pcard');
    c2.appendChild(el('div', 'pcard__h', 'Progression par langue'));
    c2.appendChild(el('div', 'ptext',
      'Les deux parcours sont totalement independants. Alexis peut etre ' +
      'avance en francais et debutant en anglais.'));
    ['fr', 'en'].forEach(function (l) {
      var r = el('div', 'prow');
      r.appendChild(el('span', 'prow__l', (l === 'fr' ? '\ud83c\uddeb\ud83c\uddf7 Francais' : '\ud83c\uddec\ud83c\udde7 English')));
      r.appendChild(el('span', 'prow__v', App.State.missionsDone(l) + ' mission' +
        (App.State.missionsDone(l) > 1 ? 's' : '')));
      c2.appendChild(r);
    });
    b.appendChild(c2);
  }

  /* ---------- Reglages ---------- */

  function drawSettings(b) {
    var st = App.State.get();

    /* ---- Studio de voix : la vraie reponse au son robotique ---- */
    var c0 = el('div', 'pcard');
    c0.appendChild(el('div', 'pcard__h', '\ud83c\udfa4 Votre voix'));
    c0.appendChild(el('div', 'ptext',
      'La synthese vocale est mauvaise pour apprendre a lire : elle prononce ' +
      'souvent le nom de la lettre au lieu du son. Enregistrez vous-meme les ' +
      'sons ci-dessous et Alexis entendra une vraie voix humaine \u2014 la votre.'));

    if (!App.Voice.supported()) {
      c0.appendChild(el('div', 'pwarn',
        'L\u2019enregistrement demande un navigateur recent et une adresse en https. ' +
        'Il fonctionne sur votre lien GitHub Pages, pas en ouvrant le fichier ' +
        'directement depuis le disque.'));
    } else {
      c0.appendChild(row2('Sons enregistres', App.Voice.count()));
      c0.appendChild(voiceStudio());
      var clr = el('button', 'btn btn--quiet btn--block', 'Effacer tous mes enregistrements');
      clr.addEventListener('click', function () {
        if (window.confirm('Supprimer tous vos enregistrements ?')) {
          App.Voice.clearAll().then(function () { draw(); });
        }
      });
      c0.appendChild(clr);
    }
    b.appendChild(c0);

    /* ---- Repli synthese ---- */
    var c1 = el('div', 'pcard');
    c1.appendChild(el('div', 'pcard__h', 'Repli : synthese vocale'));
    var fr = App.Audio.listFor('fr'), en = App.Audio.listFor('en');
    c1.appendChild(el('div', 'ptext',
      'Utilisee uniquement quand aucun enregistrement n\u2019existe pour un son. ' +
      'Choisissez la voix la plus naturelle disponible : les voix marquees ' +
      '\u00ab en ligne \u00bb sont nettement meilleures que les voix locales.'));

    [['fr', 'Voix francaise', fr, 'voiceFr'], ['en', 'Voix anglaise', en, 'voiceEn']].forEach(function (p) {
      c1.appendChild(el('div', 'eyebrow', p[1]));
      if (!p[2].length) {
        c1.appendChild(el('div', 'pwarn', 'Aucune voix ' + p[1].toLowerCase() +
          ' sur cet appareil. Les activites dans cette langue resteront muettes.'));
        return;
      }
      var sel = document.createElement('select');
      sel.className = 'psel';
      p[2].forEach(function (v) {
        var o = document.createElement('option');
        o.value = v.name;
        o.textContent = v.name + (v.localService ? ' (locale)' : ' (en ligne)');
        if (st.settings[p[3]] === v.name) o.selected = true;
        sel.appendChild(o);
      });
      sel.addEventListener('change', function () {
        st.settings[p[3]] = sel.value;
        App.State.save();
        App.Audio.speak(p[0] === 'fr' ? 'Bonjour Alexis' : 'Hello Alexis', p[0]);
      });
      c1.appendChild(sel);
      var t = el('button', 'btn btn--quiet btn--block', 'Tester');
      t.addEventListener('click', function () {
        App.Audio.speak(p[0] === 'fr'
          ? 'Bonjour Alexis, on va lire ensemble.'
          : 'Hello Alexis, let us read together.', p[0]);
      });
      c1.appendChild(t);
    });

    var rng = document.createElement('input');
    rng.type = 'range'; rng.min = '0.5'; rng.max = '1.1'; rng.step = '0.05';
    rng.value = String(st.settings.rate);
    rng.className = 'prange';
    rng.addEventListener('input', function () { st.settings.rate = parseFloat(rng.value); App.State.save(); });
    c1.appendChild(el('div', 'eyebrow', 'Vitesse'));
    c1.appendChild(rng);

    var snd = el('button', 'btn btn--quiet btn--block', st.settings.sound ? 'Son : active' : 'Son : coupe');
    snd.addEventListener('click', function () { st.settings.sound = !st.settings.sound; App.State.save(); draw(); });
    c1.appendChild(snd);
    b.appendChild(c1);

    /* ---- Prototype ---- */
    var c2 = el('div', 'pcard');
    c2.appendChild(el('div', 'pcard__h', 'Prototype'));
    var demo = el('button', 'btn btn--primary btn--block', 'Charger une progression de demonstration');
    demo.addEventListener('click', function () { seedDemo(); draw(); });
    c2.appendChild(demo);
    var rst = el('button', 'btn btn--quiet btn--block', 'Tout remettre a zero');
    rst.addEventListener('click', function () {
      if (window.confirm('Effacer toute la progression d\u2019Alexis ?')) {
        App.State.reset(); App.State.load(); close();
      }
    });
    c2.appendChild(rst);
    b.appendChild(c2);
  }

  /* ---------- Le studio : une ligne par son a enregistrer ---------- */

  function voiceStudio() {
    var wrap = el('div', 'studio');
    var recording = null;

    VOICE_LIST.forEach(function (grp) {
      wrap.appendChild(el('div', 'eyebrow', grp.label));
      grp.items.forEach(function (it) {
        var row = el('div', 'vrow');
        row.appendChild(el('span', 'vrow__k', it.show));
        row.appendChild(el('span', 'vrow__h', it.how));

        var play = el('button', 'vrow__b', App.Voice.has(it.key) ? '\u25b6' : '\u2013');
        play.disabled = !App.Voice.has(it.key);
        play.addEventListener('click', function () { App.Voice.play(it.key); });

        var rec = el('button', 'vrow__r', '\u25cf');
        rec.addEventListener('click', function () {
          if (recording === it.key) {
            App.Voice.stop(it.key).then(function () {
              recording = null;
              rec.classList.remove('is-rec');
              rec.textContent = '\u25cf';
              play.disabled = false;
              play.textContent = '\u25b6';
              row.classList.add('is-done');
            }, function () { recording = null; rec.classList.remove('is-rec'); rec.textContent = '\u25cf'; });
            return;
          }
          if (recording) return;
          App.Voice.start().then(function () {
            recording = it.key;
            rec.classList.add('is-rec');
            rec.textContent = '\u25a0';
          }, function () {
            rec.textContent = '\u2717';
            setTimeout(function () { rec.textContent = '\u25cf'; }, 1200);
          });
        });

        if (App.Voice.has(it.key)) row.classList.add('is-done');
        row.appendChild(play);
        row.appendChild(rec);
        wrap.appendChild(row);
      });
    });
    return wrap;
  }

  /* Ce qu'il vaut la peine d'enregistrer en premier : les phonemes des
     cinq premieres missions, puis les mots des premiers livres. */
  var VOICE_LIST = [
    { label: '\ud83c\uddeb\ud83c\uddf7 Sons francais \u2014 dites LE SON, pas le nom de la lettre',
      items: [
        { key: 'fr:phoneme:m', show: 'M', how: 'mmmmm, tenu' },
        { key: 'fr:phoneme:a', show: 'A', how: 'aaaaa, bouche ouverte' },
        { key: 'fr:phoneme:l', show: 'L', how: 'lllll, tenu' },
        { key: 'fr:phoneme:i', show: 'I', how: 'iiiii' },
        { key: 'fr:phoneme:o', show: 'O', how: 'ooooo' },
        { key: 'fr:phoneme:t', show: 'T', how: 'te, tres bref' },
        { key: 'fr:phoneme:p', show: 'P', how: 'pe, tres bref' },
        { key: 'fr:phoneme:s', show: 'S', how: 'sssss, tenu' }
      ] },
    { label: '\ud83c\uddeb\ud83c\uddf7 Syllabes et mots',
      items: [
        { key: 'fr:syll:ma', show: 'MA', how: 'ma' },
        { key: 'fr:syll:la', show: 'LA', how: 'la' },
        { key: 'fr:word:lama', show: 'LAMA', how: 'lama' },
        { key: 'fr:word:mama', show: 'MAMA', how: 'mama' }
      ] },
    { label: '\ud83c\uddec\ud83c\udde7 English sounds \u2014 a native speaker is best',
      items: [
        { key: 'en:phoneme:s', show: 'S', how: 'sss' },
        { key: 'en:phoneme:a', show: 'A', how: 'ah, short' },
        { key: 'en:phoneme:t', show: 'T', how: 'tuh, very short' },
        { key: 'en:phoneme:p', show: 'P', how: 'puh, very short' },
        { key: 'en:phoneme:i', show: 'I', how: 'ih' },
        { key: 'en:phoneme:n', show: 'N', how: 'nnn' },
        { key: 'en:phoneme:m', show: 'M', how: 'mmm' }
      ] },
    { label: '\ud83c\uddeb\ud83c\uddf7 Consignes \u2014 la voix qui explique quoi faire',
      items: [
        { key: 'fr:instruction:q-syllcount', show: 'Syllabes', how: 'Combien de syllabes entends-tu dans ce mot ?' },
        { key: 'fr:instruction:q-findletter', show: 'Lettre', how: 'Trouve la lettre qui fait ce son.' },
        { key: 'fr:instruction:q-whichstarts', show: 'Commence', how: 'Quel mot commence par ce son ?' },
        { key: 'fr:instruction:q-blend', show: 'Coller', how: 'Ecoute les deux sons, puis colle-les ensemble.' },
        { key: 'fr:instruction:q-build', show: 'Construire', how: 'Construis le mot en touchant les morceaux dans le bon ordre.' },
        { key: 'fr:instruction:fb-bravo', show: 'Bravo', how: 'Bravo !' },
        { key: 'fr:instruction:fb-again', show: 'Essaie', how: 'Essaie encore. Ecoute bien.' },
        { key: 'fr:instruction:fb-listen', show: 'Aide', how: 'Ecoute encore une fois.' }
      ] },
    { label: '\ud83c\uddec\ud83c\udde7 Instructions',
      items: [
        { key: 'en:instruction:q-syllcount', show: 'Syllables', how: 'How many syllables do you hear in this word?' },
        { key: 'en:instruction:q-findletter', show: 'Letter', how: 'Find the letter that makes this sound.' },
        { key: 'en:instruction:q-blend', show: 'Blend', how: 'Listen to the two sounds, then push them together.' },
        { key: 'en:instruction:fb-bravo', show: 'Well done', how: 'Well done!' },
        { key: 'en:instruction:fb-again', show: 'Try again', how: 'Try again. Listen carefully.' }
      ] },
    { label: '\ud83c\uddec\ud83c\udde7 Words',
      items: [
        { key: 'en:word:sat', show: 'SAT', how: 'sat' },
        { key: 'en:word:tap', show: 'TAP', how: 'tap' },
        { key: 'en:word:tin', show: 'TIN', how: 'tin' },
        { key: 'en:word:man', show: 'MAN', how: 'man' }
      ] }
  ];

  /* ---------- Progression de demonstration ---------- */

  function seedDemo() {
    var s = App.State.get();
    ['fr', 'en'].forEach(function (lang) {
      App.Engine.all(lang).filter(App.Engine.playable).slice(0, 4).forEach(function (m, i) {
        App.State.finishMission(m.id, lang, 3 - (i % 2), 9 * 60000);
        if (m.skill) {
          var k = App.State.skill(m.skill);
          k.score = 78 + Math.round(Math.random() * 18);
          k.attempts = 10 + i; k.correct = k.attempts - 2; k.seen = 2; k.last = Date.now();
        }
      });
    });
    var weak = App.State.skill('fr.g.a');
    weak.score = 44; weak.attempts = 12; weak.correct = 5; weak.seen = 2; weak.last = Date.now();

    s.days[App.State.today()] = { fr: 9 * 60, en: 7 * 60 };
    s.streak = 4;
    App.Rewards.check();
    App.State.save();
  }

  return { askUnlock: askUnlock, open: open, close: close, seedDemo: seedDemo };
})();

</script>
<script>
/* ===== js/app.js ===== */
/* =========================================================
   js/app.js — Demarrage
   ========================================================= */

(function () {
  function boot() {
    App.State.load();
    if (DATA.audio.registerInstructions) DATA.audio.registerInstructions();
    App.Audio.init();
    App.Mission.mount();
    App.UI.mount();
    App.Rewards.check();
    setTimeout(checkVoices, 1600);
    App.Audio.onReady(function () { setTimeout(checkVoices, 200); });
  }

  function checkVoices() {
    var box = document.getElementById('voiceNotice');
    if (!box) return;
    if (App.Audio.hasRecordings()) { box.hidden = true; return; }
    var missing = [];
    if (!App.Audio.has('fr')) missing.push('francaise');
    if (!App.Audio.has('en')) missing.push('anglaise');
    if (!missing.length) { box.hidden = true; return; }
    box.hidden = false;
    box.textContent = 'Aucune voix ' + missing.join(' ni ') +
      " n'est disponible sur cet appareil. L'audio est essentiel ici : ajoutez une voix " +
      'dans les reglages du systeme, ou ouvrez le prototype dans Chrome, Edge ou Safari.';
  }

  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
  else boot();
})();

</script>
</body>
