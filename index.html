<!DOCTYPE html>
<html lang="fr" data-lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<title>Alexis apprend à lire — FR / EN</title>
<meta name="description" content="Prototype V2 — apprentissage de la lecture bilingue français / anglais, organisé en missions.">
<meta name="theme-color" content="#0B1E2D">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Andika:wght@400;700&family=Fredoka:wght@400;500;600;700&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">

<link rel="stylesheet" href="css/tokens.css">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/child.css">
<link rel="stylesheet" href="css/mission.css">
<link rel="stylesheet" href="css/parent.css">
<link rel="icon" href="assets/icons/favicon.svg" type="image/svg+xml">
</head>

<body>
<div class="app">

  <header class="topbar">
    <div class="topbar__avatar" id="tbAvatar">🦊</div>
    <div class="topbar__who">
      <div class="topbar__hello" id="tbHello">Bonjour</div>
      <div class="topbar__name" id="tbName">Alexis</div>
    </div>
    <div class="topbar__stars" id="tbStars">⭐ 0</div>
  </header>

  <div class="notice" id="voiceNotice" hidden></div>

  <main class="app__main">
    <section class="screen" id="screen-home"></section>
    <section class="screen" id="screen-map" hidden></section>
    <section class="screen" id="screen-books" hidden></section>
    <section class="screen" id="screen-stars" hidden></section>
  </main>

  <nav class="tabbar">
    <button class="tab is-active" id="tab-home"><span class="tab__ico">🏠</span><span class="tab__lbl">Accueil</span></button>
    <button class="tab" id="tab-map"><span class="tab__ico">🗺️</span><span class="tab__lbl">Mon aventure</span></button>
    <button class="tab" id="tab-books"><span class="tab__ico">📚</span><span class="tab__lbl">Mes livres</span></button>
    <button class="tab" id="tab-stars"><span class="tab__ico">⭐</span><span class="tab__lbl">Mes étoiles</span></button>
  </nav>

  <!-- Mission en cours -->
  <div class="mission" id="mission" hidden>
    <div class="mbar">
      <button class="mbar__quit" id="mQuit" aria-label="Quitter">✕</button>
      <div class="mbar__track" id="mBar"></div>
      <span class="mbar__phase" id="mPhase"></span>
    </div>
    <div class="task" id="mTask"></div>
  </div>

  <!-- Lecteur de livre -->
  <div class="reader" id="reader" hidden></div>

  <!-- Espace parent -->
  <div class="parent" id="parent" hidden></div>
  <div class="plock" id="plock" hidden></div>

  <!-- Feuille modale -->
  <div class="sheet" id="sheet" hidden>
    <div class="card">
      <div id="sheetBody"></div>
      <button class="btn btn--quiet btn--block" id="sheetClose">Fermer</button>
    </div>
  </div>

</div>

<!-- Contenu pédagogique, séparé de l'interface -->
<script src="data/worlds.js"></script>
<script src="data/skills.fr.js"></script>
<script src="data/skills.en.js"></script>
<script src="data/audio.js"></script>
<script src="data/missions.fr.js"></script>
<script src="data/missions.en.js"></script>
<script src="data/books.js"></script>
<script src="data/rewards.js"></script>

<!-- Application -->
<script src="js/state.js"></script>
<script src="js/i18n.js"></script>
<script src="js/audio.js"></script>
<script src="js/engine.js"></script>
<script src="js/activities.js"></script>
<script src="js/rewards.js"></script>
<script src="js/mission.js"></script>
<script src="js/ui.js"></script>
<script src="js/parent.js"></script>
<script src="js/app.js"></script>

</body>
</html>
