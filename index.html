<!DOCTYPE html>
<html lang="fr" data-lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<title>Alexis apprend à lire — FR / EN</title>
<meta name="description" content="Prototype V2 — apprentissage de la lecture bilingue français / anglais, organisé en missions.">
<meta name="theme-color" content="#0B1E2D">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Andika:wght@400;700&family=Fredoka:wght@400;500;600;700&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">

<style>
/* ===== css/tokens.css ===== */
/* =========================================================
   tokens.css — Système de design "Atlas des sons"
   Direction : carnet d'expédition. Une coque nuit-pétrole (le monde),
   des cartes papier chaud (le contenu), deux territoires colorés
   (FR cobalt / EN ambre) posés sur la même carte.
   ========================================================= */

:root {
  /* --- Coque : la nuit d'expédition --- */
  --abyss:      #0B1E2D;
  --abyss-2:    #10293C;
  --sea:        #16374F;
  --sea-line:   #1F4A66;

  /* --- Papier : le contenu --- */
  --paper:      #FFF4E4;
  --paper-2:    #FFE8CB;
  --paper-3:    #F7DCBB;
  --ink:        #12293B;
  --ink-soft:   #5D7A8F;
  --ink-faint:  #94AABB;

  /* --- Les deux territoires --- */
  --fr:         #4A6CF7;
  --fr-deep:    #2E4CD0;
  --fr-wash:    #E3E9FF;
  --en:         #FF7A29;
  --en-deep:    #D95A0F;
  --en-wash:    #FFE9D6;

  /* --- Signaux --- */
  --jade:       #1FBE86;
  --jade-wash:  #DEF7ED;
  --gold:       #FFC948;
  --rose:       #FF7C9C;
  --rose-wash:  #FFE6EC;

  /* --- Maîtrise (§13) --- */
  --m-discovery:     #B9C9D6;
  --m-learning:      #FFC948;
  --m-consolidation: #4CC9F0;
  --m-mastered:      #1FBE86;

  /* --- Typographie --- */
  --font-display: 'Fredoka', ui-rounded, 'SF Pro Rounded', 'Segoe UI', system-ui, sans-serif;
  --font-body:    'Nunito', ui-rounded, 'SF Pro Rounded', 'Segoe UI', system-ui, sans-serif;
  /* Andika est dessinée pour l'apprentissage de la lecture :
     'a' et 'g' à un seul étage, formes non ambiguës. Réservée au texte à décoder. */
  --font-read:    'Andika', 'Comic Sans MS', var(--font-body);

  --t-xs: 0.75rem;
  --t-sm: 0.875rem;
  --t-md: 1rem;
  --t-lg: 1.25rem;
  --t-xl: 1.625rem;
  --t-2xl: 2.125rem;
  --t-3xl: 3rem;
  --t-mega: 5rem;

  /* --- Rythme --- */
  --s1: 4px;  --s2: 8px;  --s3: 12px; --s4: 16px;
  --s5: 24px; --s6: 32px; --s7: 48px; --s8: 64px;

  --r-sm: 10px;
  --r-md: 18px;
  --r-lg: 26px;
  --r-xl: 34px;
  --r-pill: 999px;

  --shadow-card:  0 2px 0 rgba(18,41,59,.10), 0 10px 30px rgba(6,20,32,.28);
  --shadow-lift:  0 4px 0 rgba(18,41,59,.14), 0 18px 40px rgba(6,20,32,.34);
  --shadow-press: 0 1px 0 rgba(18,41,59,.16);

  --app-max: 440px;
}

/* Territoire actif : une seule variable pilote tout l'accent de l'interface */
[data-lang='fr'] { --accent: var(--fr); --accent-deep: var(--fr-deep); --accent-wash: var(--fr-wash); }
[data-lang='en'] { --accent: var(--en); --accent-deep: var(--en-deep); --accent-wash: var(--en-wash); }

</style>
<style>
/* ===== css/base.css ===== */
/* =========================================================
   base.css — Reset, coque de l'application, composants communs
   ========================================================= */

*, *::before, *::after { box-sizing: border-box; }

html, body {
  margin: 0; padding: 0;
  height: 100%;
  background: var(--abyss);
  color: var(--paper);
  font-family: var(--font-body);
  font-size: 16px;
  -webkit-font-smoothing: antialiased;
  -webkit-tap-highlight-color: transparent;
}

body {
  /* Fond "carte d'expédition" : lignes de niveau discrètes */
  background-image:
    radial-gradient(1200px 700px at 50% -10%, #1B4460 0%, transparent 60%),
    radial-gradient(900px 600px at 100% 100%, #12354C 0%, transparent 55%),
    repeating-radial-gradient(circle at 20% 30%, transparent 0 38px, rgba(255,244,228,.022) 38px 39px),
    repeating-radial-gradient(circle at 82% 72%, transparent 0 46px, rgba(255,244,228,.018) 46px 47px);
  background-attachment: fixed;
}

button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; border: 0; background: none; }
h1,h2,h3,h4 { margin: 0; font-family: var(--font-display); font-weight: 600; line-height: 1.15; }
p { margin: 0 0 var(--s3); line-height: 1.55; }
ul { margin: 0; padding: 0; list-style: none; }

:focus-visible {
  outline: 3px solid var(--gold);
  outline-offset: 3px;
  border-radius: 6px;
}

/* ---------- Coque ---------- */
.app {
  position: relative;
  width: 100%;
  max-width: var(--app-max);
  min-height: 100dvh;
  margin: 0 auto;
  display: flex;
  flex-direction: column;
  background: linear-gradient(180deg, rgba(11,30,45,.2), rgba(11,30,45,.75));
}
@media (min-width: 900px) {
  .app {
    min-height: min(880px, 94dvh);
    margin: 3dvh auto;
    border-radius: var(--r-xl);
    box-shadow: 0 40px 90px rgba(0,0,0,.5), 0 0 0 1px rgba(255,244,228,.08);
    overflow: hidden;
  }
}

.app__main { flex: 1; display: flex; flex-direction: column; min-height: 0; }
.screen { flex: 1; overflow-y: auto; padding: var(--s4) var(--s4) 110px; }
.screen--flush { padding-left: 0; padding-right: 0; }
.screen[hidden] { display: none; }

/* ---------- Barre du haut ---------- */
.topbar {
  display: flex; align-items: center; gap: var(--s3);
  padding: var(--s4) var(--s4) var(--s2);
}
.topbar__avatar {
  width: 46px; height: 46px; flex: none;
  display: grid; place-items: center;
  font-size: 26px; line-height: 1;
  border-radius: var(--r-pill);
  background: var(--paper);
  box-shadow: var(--shadow-card);
  position: relative;
}
.topbar__acc { position: absolute; top: -8px; right: -6px; font-size: 16px; }
.topbar__who { flex: 1; min-width: 0; }
.topbar__hello { font-size: var(--t-xs); color: var(--ink-faint); letter-spacing: .09em; text-transform: uppercase; }
.topbar__name { font-family: var(--font-display); font-size: var(--t-lg); }
.topbar__stars {
  display: flex; align-items: center; gap: 5px;
  background: rgba(255,201,72,.14);
  border: 1px solid rgba(255,201,72,.3);
  color: var(--gold);
  padding: 6px 12px; border-radius: var(--r-pill);
  font-weight: 800; font-size: var(--t-sm);
}

/* ---------- Cartes ---------- */
.card {
  background: var(--paper);
  color: var(--ink);
  border-radius: var(--r-lg);
  padding: var(--s5);
  box-shadow: var(--shadow-card);
}
.card--tint { background: linear-gradient(160deg, var(--paper), var(--paper-2)); }
.card + .card { margin-top: var(--s4); }

.eyebrow {
  font-size: var(--t-xs); letter-spacing: .12em; text-transform: uppercase;
  font-weight: 800; color: var(--ink-faint);
}
.eyebrow--light { color: rgba(255,244,228,.5); }

/* ---------- Boutons ---------- */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: var(--s2);
  padding: 15px 22px;
  border-radius: var(--r-md);
  font-family: var(--font-display);
  font-size: var(--t-md); font-weight: 600;
  background: var(--paper); color: var(--ink);
  box-shadow: 0 3px 0 rgba(0,0,0,.18);
  transition: transform .12s ease, box-shadow .12s ease;
}
.btn:active { transform: translateY(3px); box-shadow: var(--shadow-press); }
.btn--block { display: flex; width: 100%; }
.btn--primary {
  background: var(--accent, var(--fr)); color: #fff;
  box-shadow: 0 4px 0 var(--accent-deep, var(--fr-deep)), 0 10px 26px rgba(0,0,0,.3);
}
.btn--primary:active { box-shadow: 0 1px 0 var(--accent-deep, var(--fr-deep)); }
.btn--big { padding: 20px 26px; font-size: var(--t-lg); border-radius: var(--r-lg); }
.btn--ghost {
  background: transparent; color: var(--paper);
  box-shadow: inset 0 0 0 2px rgba(255,244,228,.28);
}
.btn--quiet { background: var(--paper-2); box-shadow: 0 2px 0 var(--paper-3); }
.btn--sm { padding: 9px 14px; font-size: var(--t-sm); border-radius: var(--r-sm); }
.btn[disabled] { opacity: .45; pointer-events: none; }

/* ---------- Barre d'onglets ---------- */
.tabbar {
  position: absolute; left: 0; right: 0; bottom: 0;
  display: grid; grid-template-columns: repeat(4, 1fr);
  padding: var(--s2) var(--s3) calc(var(--s3) + env(safe-area-inset-bottom, 0px));
  background: linear-gradient(180deg, rgba(11,30,45,0), rgba(8,24,36,.96) 42%);
  backdrop-filter: blur(10px);
  z-index: 30;
}
.tab {
  display: flex; flex-direction: column; align-items: center; gap: 3px;
  padding: 8px 4px; border-radius: var(--r-md);
  color: rgba(255,244,228,.5);
  font-size: 10.5px; font-weight: 700; letter-spacing: .02em;
  transition: color .15s ease, background .15s ease;
}
.tab__ico { font-size: 21px; line-height: 1; }
.tab.is-active { color: var(--paper); background: rgba(255,244,228,.08); }
.tab.is-active .tab__ico { transform: translateY(-1px); }

/* ---------- Drapeau / pastille de langue ---------- */
.langchip {
  display: inline-flex; align-items: center; gap: 7px;
  padding: 5px 12px 5px 7px; border-radius: var(--r-pill);
  font-weight: 800; font-size: var(--t-xs); letter-spacing: .06em; text-transform: uppercase;
  background: var(--accent-wash); color: var(--accent-deep);
}
.langchip__flag { font-size: 15px; }

/* ---------- Divers ---------- */
.stack > * + * { margin-top: var(--s4); }
.row { display: flex; align-items: center; gap: var(--s3); }
.row--between { justify-content: space-between; }
.muted { color: var(--ink-soft); }
.center { text-align: center; }
.sr-only {
  position: absolute; width: 1px; height: 1px; overflow: hidden;
  clip: rect(0 0 0 0); white-space: nowrap;
}

.bar { height: 10px; border-radius: var(--r-pill); background: var(--paper-3); overflow: hidden; }
.bar__fill { height: 100%; border-radius: var(--r-pill); background: var(--accent); transition: width .6s cubic-bezier(.2,.8,.2,1); }

/* ---------- Toast / bandeau ---------- */
.notice {
  margin: var(--s3) var(--s4) 0;
  padding: var(--s3) var(--s4);
  border-radius: var(--r-md);
  background: rgba(255,124,156,.14);
  border: 1px solid rgba(255,124,156,.35);
  color: #FFD9E2;
  font-size: var(--t-sm);
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: .001ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: .001ms !important;
  }
}

/* ---------- Feuille modale ---------- */
.sheet {
  position: fixed; inset: 0; z-index: 65;
  display: flex; align-items: flex-end; justify-content: center;
  padding: var(--s4);
  background: rgba(7,20,31,.72);
  backdrop-filter: blur(6px);
  animation: fade .2s ease;
}
@media (min-width: 900px) { .sheet { position: absolute; border-radius: var(--r-xl); align-items: center; } }
.sheet[hidden] { display: none; }
.sheet .card { animation: rise .28s cubic-bezier(.2,.9,.3,1); max-height: 82dvh; overflow-y: auto; }
@keyframes fade { from { opacity: 0; } to { opacity: 1; } }
@keyframes rise { from { transform: translateY(26px); opacity: 0; } to { transform: none; opacity: 1; } }

</style>
<style>
/* ===== css/child.css ===== */
/* =========================================================
   child.css — Espace enfant : accueil, aventure, livres, récompenses
   ========================================================= */

/* ---------------- ACCUEIL : le héros du jour ---------------- */
.today {
  position: relative;
  border-radius: var(--r-xl);
  padding: var(--s6) var(--s5) var(--s5);
  background:
    radial-gradient(120% 100% at 10% 0%, rgba(255,255,255,.22), transparent 60%),
    linear-gradient(150deg, var(--accent), var(--accent-deep));
  color: #fff;
  box-shadow: var(--shadow-lift);
  overflow: hidden;
}
.today::after {
  /* horizon de la carte : un arc qui rappelle le globe */
  content: '';
  position: absolute; left: -30%; right: -30%; bottom: -78%;
  aspect-ratio: 1;
  border-radius: 50%;
  border: 2px dashed rgba(255,255,255,.22);
  pointer-events: none;
}
.today__label { font-size: var(--t-xs); letter-spacing: .16em; text-transform: uppercase; opacity: .8; font-weight: 800; }
.today__flag { font-size: 44px; line-height: 1; margin: var(--s3) 0 var(--s2); }
.today__title { font-family: var(--font-display); font-size: var(--t-2xl); font-weight: 600; margin-bottom: var(--s2); }
.today__sub { opacity: .88; font-size: var(--t-sm); margin-bottom: var(--s5); position: relative; }
.today .btn { position: relative; }

.today__cta {
  background: var(--paper); color: var(--ink);
  box-shadow: 0 5px 0 rgba(0,0,0,.22), 0 14px 30px rgba(0,0,0,.24);
}
.today__cta:active { box-shadow: 0 1px 0 rgba(0,0,0,.22); }

/* ---------------- Prochaine étape / livre du jour ---------------- */
.nextup { display: flex; align-items: center; gap: var(--s4); }
.nextup__ico {
  width: 56px; height: 56px; flex: none; display: grid; place-items: center;
  font-size: 28px; border-radius: var(--r-md);
  background: var(--accent-wash);
}
.nextup__t { font-family: var(--font-display); font-size: var(--t-md); }
.nextup__s { font-size: var(--t-sm); color: var(--ink-soft); }
.nextup__go { margin-left: auto; font-size: 22px; color: var(--ink-faint); }

/* ---------------- L'AVENTURE : la carte-fleuve ---------------- */
.journey { position: relative; padding: var(--s5) 0 var(--s6); }
.journey__svg { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
.journey__path { fill: none; stroke: rgba(255,244,228,.16); stroke-width: 14; stroke-linecap: round; }
.journey__path--done { stroke: var(--accent); stroke-width: 14; opacity: .95; }

.node {
  position: absolute; transform: translate(-50%, -50%);
  display: flex; flex-direction: column; align-items: center; gap: 6px;
  width: 130px; text-align: center;
}
.node__bubble {
  width: 62px; height: 62px; border-radius: var(--r-pill);
  display: grid; place-items: center; font-size: 27px;
  background: var(--paper); color: var(--ink);
  box-shadow: 0 4px 0 rgba(0,0,0,.28), 0 8px 22px rgba(0,0,0,.3);
  border: 4px solid var(--paper);
  transition: transform .15s ease;
}
.node:active .node__bubble { transform: scale(.94); }
.node__label { font-size: 11.5px; font-weight: 800; color: rgba(255,244,228,.82); line-height: 1.25; }
.node__ring {
  position: absolute; top: -5px; left: 50%; transform: translateX(-50%);
  width: 72px; height: 72px; border-radius: var(--r-pill);
  border: 3px solid var(--accent);
  opacity: 0; pointer-events: none;
}

.node.is-locked .node__bubble { background: rgba(255,244,228,.12); border-color: transparent; box-shadow: none; color: rgba(255,244,228,.35); }
.node.is-locked .node__label { color: rgba(255,244,228,.34); }
.node.is-done .node__bubble { border-color: var(--jade); }
.node.is-current .node__bubble { border-color: var(--accent); animation: pulse 2.4s ease-in-out infinite; }
.node.is-current .node__ring { opacity: 1; animation: halo 2.4s ease-in-out infinite; }

@keyframes pulse { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-5px); } }
@keyframes halo  { 0%,100% { transform: translateX(-50%) scale(1); opacity: .7; } 50% { transform: translateX(-50%) scale(1.22); opacity: 0; } }

.node__you {
  position: absolute; top: -34px; font-size: 26px;
  filter: drop-shadow(0 4px 6px rgba(0,0,0,.4));
  animation: bob 2.6s ease-in-out infinite;
}
@keyframes bob { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-6px); } }

.chapter {
  margin: var(--s5) var(--s4) var(--s2);
  font-family: var(--font-display); font-size: var(--t-sm);
  color: rgba(255,244,228,.55); letter-spacing: .06em; text-transform: uppercase;
}

/* Bascule FR / EN dans l'aventure */
.switch {
  display: grid; grid-template-columns: 1fr 1fr; gap: 6px;
  padding: 5px; margin: 0 var(--s4) var(--s4);
  background: rgba(255,244,228,.09); border-radius: var(--r-pill);
}
.switch button {
  padding: 11px; border-radius: var(--r-pill);
  font-weight: 800; font-size: var(--t-sm); color: rgba(255,244,228,.6);
  transition: background .18s ease, color .18s ease;
}
.switch button.is-on { background: var(--paper); color: var(--ink); box-shadow: 0 2px 8px rgba(0,0,0,.25); }

/* ---------------- LIVRES ---------------- */
.shelf { display: grid; grid-template-columns: repeat(2, 1fr); gap: var(--s4); }
.book {
  background: var(--paper); color: var(--ink);
  border-radius: var(--r-md); overflow: hidden;
  box-shadow: var(--shadow-card);
  text-align: left; display: flex; flex-direction: column;
}
.book__cover {
  aspect-ratio: 4/3; display: grid; place-items: center; font-size: 46px;
  background: linear-gradient(150deg, var(--accent-wash), var(--paper-2));
}
.book__meta { padding: var(--s3) var(--s3) var(--s4); }
.book__title { font-family: var(--font-display); font-size: var(--t-sm); line-height: 1.2; }
.book__lvl { font-size: var(--t-xs); color: var(--ink-soft); margin-top: 3px; }
.book.is-locked { opacity: .5; }
.book.is-locked .book__cover { filter: grayscale(1); }

.bookhero {
  display: flex; gap: var(--s4); align-items: center;
}
.bookhero__cover {
  width: 84px; height: 84px; flex: none; border-radius: var(--r-md);
  display: grid; place-items: center; font-size: 40px;
  background: linear-gradient(150deg, var(--accent-wash), var(--paper-2));
}

/* ---------------- RÉCOMPENSES ---------------- */
.hero-avatar {
  display: grid; place-items: center; gap: var(--s3);
  padding: var(--s5) 0;
}
.hero-avatar__disc {
  width: 132px; height: 132px; border-radius: var(--r-pill);
  display: grid; place-items: center; font-size: 68px;
  background: radial-gradient(circle at 35% 25%, var(--paper), var(--paper-3));
  box-shadow: 0 8px 0 rgba(0,0,0,.25), 0 20px 44px rgba(0,0,0,.35);
  position: relative;
}
.hero-avatar__acc { position: absolute; top: -6px; right: 2px; font-size: 34px; }

.picker { display: grid; grid-template-columns: repeat(3, 1fr); gap: var(--s3); }
.picker button {
  padding: var(--s3) 4px; border-radius: var(--r-md);
  background: var(--paper-2); color: var(--ink);
  display: grid; gap: 2px; place-items: center;
  box-shadow: 0 2px 0 var(--paper-3);
}
.picker button.is-on { background: var(--accent); color: #fff; box-shadow: 0 2px 0 var(--accent-deep); }
.picker__emo { font-size: 28px; }
.picker__name { font-size: 10px; font-weight: 700; text-align: center; line-height: 1.2; }
.picker button.is-locked { opacity: .42; }

.badges { display: grid; grid-template-columns: repeat(3, 1fr); gap: var(--s3); }
.badge {
  aspect-ratio: 1; border-radius: var(--r-md);
  display: grid; place-items: center; gap: 2px;
  background: var(--paper-2); color: var(--ink);
  padding: var(--s2); text-align: center;
}
.badge__emo { font-size: 30px; }
.badge__t { font-size: 9.5px; font-weight: 800; line-height: 1.15; }
.badge.is-locked { background: rgba(255,244,228,.08); color: rgba(255,244,228,.3); }
.badge.is-locked .badge__emo { filter: grayscale(1); opacity: .4; }

.statgrid { display: grid; grid-template-columns: repeat(3, 1fr); gap: var(--s3); text-align: center; }
.statgrid__n { font-family: var(--font-display); font-size: var(--t-xl); color: var(--ink); }
.statgrid__l { font-size: 10px; font-weight: 800; letter-spacing: .05em; text-transform: uppercase; color: var(--ink-faint); }

/* ---------------- Bouton discret espace parent ---------------- */
.parentkey {
  display: block; margin: var(--s6) auto var(--s5);
  font-size: var(--t-xs); letter-spacing: .1em; text-transform: uppercase;
  color: rgba(255,244,228,.34); font-weight: 700;
}

/* =========================================================
   V2 — Carte des missions, album, complements
   ========================================================= */

.stitle{font:700 22px/1.2 var(--font-display);color:#fff;margin:4px 0 14px}
.eyebrow{font:700 11px/1 var(--font-body);color:rgba(255,255,255,.5);
  letter-spacing:.09em;text-transform:uppercase;margin-bottom:8px}
.card{background:rgba(255,255,255,.07);border-radius:var(--r-lg);padding:var(--s4);margin-top:var(--s4)}
.bar{height:8px;border-radius:4px;background:rgba(255,255,255,.14);overflow:hidden;margin-top:12px}
.bar__fill{height:100%;background:var(--accent);border-radius:4px;transition:width .5s}
.today__lang{font:700 13px/1 var(--font-body);color:var(--accent);letter-spacing:.08em;

<script>
/* ===== data/audio.js ===== */
/* =========================================================
   data/audio.js — Manifeste audio

   Chaque cle utilisee par l'application est declaree ici avec :
     - le texte que la synthese doit dire SI l'enregistrement manque
     - la langue a utiliser (jamais l'anglais avec une voix francaise)

   Le fichier attendu se deduit de la cle :
     fr:phoneme:m  ->  assets/audio/fr/phoneme/m.mp3

   POUR LES PHONEMES : on prononce LE SON, jamais le nom de la lettre.
     M  ->  mmmmm        et non "emme"
     S  ->  sssss        et non "esse"
   Le texte de repli ci-dessous est ecrit phonetiquement pour pousser la
   synthese vers le son. C'est un pis-aller : ces cles sont les toutes
   premieres a enregistrer avec une vraie voix.
   ========================================================= */

window.DATA = window.DATA || {};

<script>
/* ===== js/state.js ===== */
/* =========================================================
   js/state.js — État de l'enfant, persistance locale
   Aucun backend (§7). Tout vit dans localStorage.
   ========================================================= */

window.App = window.App || {};

App.State = (function () {

  var KEY = 'alexis.reading.v3';
  var s = null;

  function today() {
    var d = new Date();
    return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
  }
  function pad(n) { return n < 10 ? '0' + n : '' + n; }

  function fresh() {
    return {
      v: 3,
      child: { name: 'Alexis', avatar: 'fox', accessory: null },
      /* 0 = dimanche. Planning par défaut du cahier des charges §7 */
      schedule: { 1: 'fr', 2: 'en', 3: 'fr', 4: 'en', 5: 'fr', 6: 'en', 0: 'free' },
      overrideLang: null,
      overrideDate: null,
      mastery: {},              /* skillId -> { score, dims, attempts, correct, seen, last } */
      stars: 0,
      badges: [],
      booksRead: [],
      lang: null,               /* langue choisie, null = on demande */
      lastLangDay: null,
      missions: {},             /* missionId -> { done, stars, times, last } */
      booksUnlocked: [],
      album: [],                /* moments importants : { icon, label, date } */
      favorites: [],
      accessories: [],
      counters: { wordsRead: 0, sentencesRead: 0, bilingual: 0 },
      days: {},                 /* '2026-08-17' -> { fr: seconds, en: seconds } */
      streak: 0,
      lastDay: null,
      settings: { rate: 0.8, sessionSteps: 7, voiceFr: '', voiceEn: '', sound: true,
                  preferred: null,   /* 'fr' | 'en' | null = laisser choisir */
                  alternate: false   /* suggerer l'alternance du planning */ },
      log: []                   /* historique court des séances */
    };
  }

  function load() {
    try {
      var raw = localStorage.getItem(KEY);
      s = raw ? JSON.parse(raw) : fresh();
    } catch (e) { s = fresh(); }
    if (!s || s.v !== 3) s = fresh();
    if (!s.settings.hasOwnProperty('preferred')) { s.settings.preferred = null; s.settings.alternate = false; }
    touchDay();
    maybeAskAgain();
    return s;
  }

  function save() {
    try { localStorage.setItem(KEY, JSON.stringify(s)); } catch (e) {}
  }

  function reset() { s = fresh(); save(); }

  function get() { return s; }

  function touchDay() {
    var t = today();
    if (!s.days[t]) s.days[t] = { fr: 0, en: 0 };
    if (s.lastDay !== t) {
      var y = new Date(); y.setDate(y.getDate() - 1);
      var yk = y.getFullYear() + '-' + pad(y.getMonth() + 1) + '-' + pad(y.getDate());
      s.streak = (s.lastDay === yk) ? s.streak + 1 : 1;
      s.lastDay = t;
      save();
    }
  }

  function addTime(lang, seconds) {
    touchDay();
    var d = s.days[today()];
    d[lang] = (d[lang] || 0) + seconds;
    save();
  }

  /* --- Maîtrise --- */
  function skill(id) {
    if (!s.mastery[id]) {
      s.mastery[id] = {
        score: 0, attempts: 0, correct: 0, seen: 0, last: null,
        dims: { recognition: 0, sound: 0, reading: 0 }
      };
    }
    return s.mastery[id];
  }

  function isSeen(id) { return !!s.mastery[id]; }

  /* Moyenne mobile : une compétence ne devient jamais "maîtrisée"
     sur une seule bonne réponse (§13). */
  function record(id, dim, ok) {
    var m = skill(id);
    m.attempts += 1;
    if (ok) m.correct += 1;
    m.last = Date.now();

    var target = ok ? 100 : 0;
    /* poids décroissant : les premières réponses bougent plus le score */
    var w = Math.max(0.16, 0.5 - m.attempts * 0.02);
    m.score = Math.round(m.score + (target - m.score) * w);

    if (dim && m.dims[dim] !== undefined) {
      m.dims[dim] = Math.round(m.dims[dim] + (target - m.dims[dim]) * 0.34);
    }
    /* Plafond tant qu'il n'y a pas assez de tentatives dans le temps */
    if (m.attempts < 4 && m.score > 70) m.score = 70;
    if (m.attempts < 8 && m.score > 88) m.score = 88;
    save();
    return m;
  }

  function markSeen(id) {
    var m = skill(id);
    m.seen += 1;
    if (!m.last) m.last = Date.now();
    save();
  }

  function addStars(n) { s.stars += n; save(); }

  function bump(counter, n) {
    s.counters[counter] = (s.counters[counter] || 0) + (n || 1);
    save();
  }

  /* La langue est choisie par l'enfant ou le parent, jamais deduite du
     jour (§1). Le planning ne sert plus que de SUGGESTION au demarrage. */
  function lang() {
    if (s.lang === 'fr' || s.lang === 'en') return s.lang;
    return suggested();
  }

  function hasChosen() { return s.lang === 'fr' || s.lang === 'en'; }

  function setLang(l) {
    if (l !== 'fr' && l !== 'en') return;
    s.lang = l;
    s.lastLangDay = today();
    save();
  }

  /* Suggestion douce : la preference du parent, sinon l'alternance,
     sinon le francais. Elle n'empeche jamais de choisir autre chose. */
  function suggested() {
    if (s.settings.preferred === 'fr' || s.settings.preferred === 'en') return s.settings.preferred;
    if (s.settings.alternate) {
      var d = s.schedule[String(new Date().getDay())];
      if (d === 'fr' || d === 'en') return d;
    }
    return 'fr';
  }

  /* Nouveau jour : on repropose le choix plutot que de le figer. */
  function maybeAskAgain() {
    if (s.lastLangDay && s.lastLangDay !== today()) s.lang = null;
  }


  function setOverride(lang) {
    s.overrideLang = lang;
    s.overrideDate = today();
    save();
  }

  function weekTotals() {
    var out = { fr: 0, en: 0 };
    var d = new Date();
    for (var i = 0; i < 7; i++) {
      var k = d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
      if (s.days[k]) { out.fr += s.days[k].fr || 0; out.en += s.days[k].en || 0; }
      d.setDate(d.getDate() - 1);
    }
    return out;
  }


  /* ---------- Missions ---------- */

  function mission(id) {
    if (!s.missions[id]) s.missions[id] = { done: false, stars: 0, times: 0, last: null };
    return s.missions[id];
  }

  function isMissionDone(id) { return !!(s.missions[id] && s.missions[id].done); }

  function finishMission(id, lang, stars, ms) {
    var m = mission(id);
    var first = !m.done;
    m.done = true;
    m.times++;
    m.stars = Math.max(m.stars, stars);
    m.last = Date.now();
    if (first) addStars(stars);
    addTime(lang, Math.round((ms || 0) / 1000));
    s.log.unshift({ t: Date.now(), mission: id, lang: lang, stars: stars });
    s.log = s.log.slice(0, 40);
    save();
    return first;
  }

  function missionsDone(lang) {
    var n = 0;
    for (var k in s.missions) {
      if (s.missions[k].done && k.indexOf(lang + '.') === 0) n++;
    }
    return n;
  }

  /* ---------- Livres ---------- */

  function unlockBook(id) {
    if (s.booksUnlocked.indexOf(id) >= 0) return false;
    s.booksUnlocked.push(id);
    save();
    return true;
  }

  function isBookUnlocked(id) { return s.booksUnlocked.indexOf(id) >= 0; }

  function markBookRead(id) {
    if (s.booksRead.indexOf(id) < 0) {
      s.booksRead.push(id);
      save();
      return true;
    }
    return false;
  }

  /* ---------- Album : les moments qui comptent ---------- */

  function remember(icon, label) {
    for (var i = 0; i < s.album.length; i++) {
      if (s.album[i].label === label) return false;
    }
    s.album.unshift({ icon: icon, label: label, date: today() });
    s.album = s.album.slice(0, 30);
    save();
    return true;
  }

  return {
    load: load, save: save, reset: reset, get: get,
    today: today, addTime: addTime, weekTotals: weekTotals,
    skill: skill, isSeen: isSeen, record: record, markSeen: markSeen,
    addStars: addStars, bump: bump,
    lang: lang, setLang: setLang, hasChosen: hasChosen, suggested: suggested,
    maybeAskAgain: maybeAskAgain, setOverride: setOverride,
    mission: mission, isMissionDone: isMissionDone, finishMission: finishMission,
    missionsDone: missionsDone,
    unlockBook: unlockBook, isBookUnlocked: isBookUnlocked, markBookRead: markBookRead,
    remember: remember
  };
})();

</script>

    q_catch: 'Tap every letter',
    q_memoryIntro: 'Turn the cards over and find the pairs.',
    q_blend: 'Listen to the two sounds, then push them together.',
    q_blendResult: 'So, what does it make?',
    q_build: 'Build the word by tapping the pieces in order.',
    q_segment: 'How many sounds do you hear in this word?',
    q_syllCount: 'How many syllables do you hear in this word?',
    q_readSyll: 'Read it out loud, then tap the button.',
    q_readWord: 'Read this word out loud, then tap the button.',
    q_wordToImage: 'What does this word mean? Tap the right picture.',
    q_instruction: 'Tap the word',
    q_rhyme: 'Which word rhymes with',
    q_oddOne: 'Three words. Two start with the same sound. Tap the one that is different.',
    q_samePair: 'Tap the two words that start with the same sound.',
    q_repeat: 'Listen carefully, then say it out loud.',
    q_clap: 'Tap once for each syllable in the word.',
    q_story: 'Read your story.',
    fb_bravo: 'Well done!',
    fb_yes: 'Yes, that\u2019s it!',
    fb_again: 'Try again. Listen carefully.',
    fb_listen: 'Listen once more.',
    fb_slower: 'Let us go slowly.'
  }
};

/* Ce que la voix doit dire pour une cle donnee. */
App.Spoken = function (key, lang) {
  var l = lang || App.State.lang();
  var d = App.I18N.spoken[l] || App.I18N.spoken.fr;
  return d[key] || App.T(key, l);
};

/* T('nextStep')        -> langue du jour
   T('nextStep', 'en')  -> force une langue                         */
App.T = function (key, lang) {
  var l = lang || App.State.lang();
  var d = App.I18N[l] || App.I18N.fr;
  return d[key] != null ? d[key] : (App.I18N.fr[key] != null ? App.I18N.fr[key] : key);
};

<script>
/* ===== js/voice.js ===== */
/* =========================================================
   js/voice.js — Studio de voix

   Reponse concrete au probleme du son robotique. Plutot que
   d'attendre des enregistrements professionnels, le parent
   enregistre sa propre voix depuis l'application. Alexis entend
   alors une vraie voix humaine — celle qu'il connait.

   Stockage : IndexedDB (les extraits sont des Blob audio).
   Ordre de resolution dans js/audio.js :
     1. fichier dans assets/audio/...        (enregistrement pro)
     2. enregistrement du parent             (ici)
     3. synthese vocale                      (dernier recours)
   ========================================================= */

window.App = window.App || {};

App.Voice = (function () {

  var DB = 'alexis.voice', STORE = 'clips';
  var db = null, urls = {}, index = {};
  var rec = null, chunks = [], stream = null;

  /* ---------- Base locale ---------- */

  function open() {
    return new Promise(function (resolve, reject) {
      if (db) return resolve(db);
      if (!window.indexedDB) return reject('indexedDB indisponible');
      var r = indexedDB.open(DB, 1);
      r.onupgradeneeded = function () {
        if (!r.result.objectStoreNames.contains(STORE)) r.result.createObjectStore(STORE);
      };
      r.onsuccess = function () { db = r.result; resolve(db); };
      r.onerror = function () { reject(r.error); };
    });
  }

  function put(key, blob) {
    return open().then(function (d) {
      return new Promise(function (resolve, reject) {
        var tx = d.transaction(STORE, 'readwrite');
        tx.objectStore(STORE).put(blob, key);
        tx.oncomplete = function () {
          index[key] = true;
          if (urls[key]) { URL.revokeObjectURL(urls[key]); delete urls[key]; }
          save();
          resolve();
        };
        tx.onerror = function () { reject(tx.error); };
      });
    });
  }

  function get(key) {
    return open().then(function (d) {
      return new Promise(function (resolve, reject) {
        var tx = d.transaction(STORE, 'readonly');
        var q = tx.objectStore(STORE).get(key);
        q.onsuccess = function () { resolve(q.result || null); };
        q.onerror = function () { reject(q.error); };
      });
    });
  }

  function del(key) {
    return open().then(function (d) {
      return new Promise(function (resolve) {
        var tx = d.transaction(STORE, 'readwrite');
        tx.objectStore(STORE).delete(key);
        tx.oncomplete = function () {
          delete index[key];
          if (urls[key]) { URL.revokeObjectURL(urls[key]); delete urls[key]; }
          save();
          resolve();
        };
      });
    });
  }

  /* L'index des cles enregistrees vit dans localStorage : on doit
     savoir instantanement si un extrait existe, sans attendre la base. */
  function save() {
    try { localStorage.setItem('alexis.voice.index', JSON.stringify(Object.keys(index))); } catch (e) {}
  }
  function load() {
    try {
      var a = JSON.parse(localStorage.getItem('alexis.voice.index') || '[]');
      a.forEach(function (k) { index[k] = true; });
    } catch (e) {}
  }

  /* ---------- Lecture ---------- */

  function has(key) { return !!index[key]; }
  function count() { return Object.keys(index).length; }

  /* Renvoie une promesse resolue a la fin de l'extrait, rejetee s'il n'existe pas */
  function play(key, rate) {
    if (!index[key]) return Promise.reject();
    return get(key).then(function (blob) {
      if (!blob) { delete index[key]; save(); return Promise.reject(); }
      return new Promise(function (resolve, reject) {
        if (!urls[key]) urls[key] = URL.createObjectURL(blob);
        var a = new window.Audio(urls[key]);
        try { a.playbackRate = rate || 1; } catch (e) {}
        a.onended = resolve;
        a.onerror = reject;
        var p = a.play();
        if (p && p.catch) p.catch(reject);
        setTimeout(resolve, 6000);
      });
    });
  }

  /* ---------- Enregistrement ---------- */

  function supported() {
    return !!(navigator.mediaDevices && navigator.mediaDevices.getUserMedia && window.MediaRecorder);
  }

  function start() {
    if (!supported()) return Promise.reject('non supporte');
    return navigator.mediaDevices.getUserMedia({ audio: true }).then(function (s) {
      stream = s;
      chunks = [];
      rec = new window.MediaRecorder(s);
      rec.ondataavailable = function (e) { if (e.data && e.data.size) chunks.push(e.data); };
      rec.start();
      return true;
    });
  }

  function stop(key) {
    return new Promise(function (resolve, reject) {
      if (!rec) return reject('aucun enregistrement en cours');
      rec.onstop = function () {
        var blob = new Blob(chunks, { type: rec.mimeType || 'audio/webm' });
        if (stream) { stream.getTracks().forEach(function (t) { t.stop(); }); stream = null; }
        rec = null;
        if (!blob.size) return reject('extrait vide');
        put(key, blob).then(function () { resolve(blob); }, reject);
      };
      try { rec.stop(); } catch (e) { reject(e); }
    });
  }

  function cancel() {
    if (rec) { try { rec.stop(); } catch (e) {} rec = null; }
    if (stream) { stream.getTracks().forEach(function (t) { t.stop(); }); stream = null; }
  }

  function clearAll() {
    return open().then(function (d) {
      return new Promise(function (resolve) {
        var tx = d.transaction(STORE, 'readwrite');
        tx.objectStore(STORE).clear();
        tx.oncomplete = function () {
          Object.keys(urls).forEach(function (k) { URL.revokeObjectURL(urls[k]); });
          urls = {}; index = {}; save(); resolve();
        };
      });
    });
  }

  load();

  return {
    supported: supported, has: has, count: count, play: play,
    start: start, stop: stop, cancel: cancel, del: del, clearAll: clearAll,
    keys: function () { return Object.keys(index); }
  };
})();

</script>
<script>
/* ===== js/audio.js ===== */
/* =========================================================
   js/audio.js — Architecture audio (V2)

   Principe : l'application ne parle JAMAIS directement a la synthese
   vocale. Elle demande une CLE audio. La couche ci-dessous decide :

     1. un enregistrement existe dans assets/audio/... ?  -> on le joue
     2. sinon -> repli sur la synthese, en dernier recours

   Le jour ou les enregistrements professionnels arrivent, il suffit de
   deposer les fichiers au bon endroit : aucune ligne de code a changer.

   Forme d'une cle :  lang:type:slug
     fr:phoneme:m      -> assets/audio/fr/phoneme/m.mp3
     fr:word:moto      -> assets/audio/fr/word/moto.mp3
     fr:ui:bravo       -> assets/audio/fr/ui/bravo.mp3
     en:story:sam-1    -> assets/audio/en/story/sam-1.mp3
   ========================================================= */

window.App = window.App || {};

App.Audio = (function () {

  var BASE = 'assets/audio/';
  var known = {};      /* cle -> 'file' | 'missing' */
  var cache = {};      /* cle -> HTMLAudioElement pret */
  var voices = [];
  var ready = [];
  var current = null;

  /* ---------- Resolution d'une cle ---------- */

  function parse(key) {
    var p = String(key).split(':');
    if (p.length < 3) return null;
    return { lang: p[0], type: p[1], slug: p.slice(2).join('-') };
  }

  function slugify(s) {
    return String(s).toLowerCase()
      .replace(/[\u00e0\u00e2\u00e4]/g, 'a').replace(/[\u00e9\u00e8\u00ea\u00eb]/g, 'e')
      .replace(/[\u00ee\u00ef]/g, 'i').replace(/[\u00f4\u00f6]/g, 'o')
      .replace(/[\u00f9\u00fb\u00fc]/g, 'u').replace(/\u00e7/g, 'c')
      .replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '');
  }

  /* Dossiers au pluriel, comme demande :
     fr/phonemes/  fr/words/  fr/instructions/  fr/sentences/  fr/stories/ */
  var FOLDER = { phoneme: 'phonemes', word: 'words', syll: 'syllables',
                 ui: 'instructions', line: 'sentences', story: 'stories' };

  function path(key) {
    var p = parse(key);
    if (!p) return null;
    return BASE + p.lang + '/' + (FOLDER[p.type] || p.type) + '/' + p.slug + '.mp3';
  }

  /* Texte de repli : ce que la synthese doit dire si le fichier manque. */
  function fallback(key) {
    var m = window.DATA && DATA.audio && DATA.audio.map[key];
    if (m) return m;
    var p = parse(key);
    if (!p) return null;
    return { text: p.slug.replace(/-/g, ' '), lang: p.lang };
  }

  /* ---------- Lecture ---------- */

  function stop() {
    if (current) {
      try { current.pause(); current.currentTime = 0; } catch (e) {}
      current = null;
    }
    if (window.speechSynthesis) { try { speechSynthesis.cancel(); } catch (e) {} }
  }

  function play(key, opts) {
    opts = opts || {};
    if (opts.stopFirst !== false) stop();
    if (!App.State.get().settings.sound) return Promise.resolve();

    var rate = opts.rate || App.State.get().settings.rate || 1;

    /* Ordre de resolution :
       1. enregistrement professionnel depose dans assets/audio
       2. voix du parent, enregistree depuis l'espace parent
       3. synthese vocale, en dernier recours seulement            */
    var p;
    if (known[key] === 'missing') {
      p = App.Voice && App.Voice.has(key)
        ? App.Voice.play(key, rate).catch(function () { return synth(key, opts); })
        : synth(key, opts);
    } else {
      p = file(key, opts).catch(function () {
        if (App.Voice && App.Voice.has(key)) {
          return App.Voice.play(key, rate).catch(function () { return synth(key, opts); });
        }
        return synth(key, opts);
      });
    }

    /* Filet de securite : une promesse audio qui ne se resout pas figerait
       l'etayage et bloquerait la mission. On borne systematiquement. */
    return settle(p, 5000);
  }

  function settle(p, ms) {
    return new Promise(function (resolve) {
      var done = false;
      function fin() { if (!done) { done = true; resolve(); } }
      try { p.then(fin, fin); } catch (e) { fin(); }
      setTimeout(fin, ms);
    });
  }

  function file(key, opts) {
    return new Promise(function (resolve, reject) {
      var src = path(key);
      if (!src || !window.Audio) return reject();

      var a = cache[key];
      if (!a) { a = new window.Audio(src); a.preload = 'auto'; }

      var done = false;
      function ok() { if (!done) { done = true; known[key] = 'file'; cache[key] = a; resolve(); } }
      function ko() { if (!done) { done = true; known[key] = 'missing'; reject(); } }

      a.onended = ok;
      a.onerror = ko;
      try { a.playbackRate = opts.rate || App.State.get().settings.rate || 1; } catch (e) {}
      current = a;

      var p = a.play();
      if (p && p.catch) p.catch(ko);
      /* Un fichier absent renvoie une erreur en quelques dizaines de ms.
         Ce plafond n'est qu'un garde-fou : trop haut, l'enfant attendrait
         une seconde avant d'entendre sa consigne. */
      setTimeout(function () { if (!done && !a.readyState) ko(); }, 450);
    });
  }

  /* ---------- Repli : synthese vocale ---------- */

  function synth(key, opts) {
    var f = fallback(key);
    if (!f) return Promise.resolve();
    return speak(f.text, f.lang, opts);
  }

  function pickVoice(lang) {
    var want = lang === 'en' ? 'en' : 'fr';
    var pref = lang === 'en'
      ? ['Samantha', 'Google UK English Female', 'Google US English', 'Zira', 'Karen', 'Daniel']
      : ['Amelie', 'Am\u00e9lie', 'Google fran\u00e7ais', 'Hortense', 'Thomas', 'Audrey'];
    var pool = voices.filter(function (v) { return (v.lang || '').toLowerCase().indexOf(want) === 0; });
    if (!pool.length) return null;
    for (var i = 0; i < pref.length; i++) {
      for (var j = 0; j < pool.length; j++) {
        if (pool[j].name.indexOf(pref[i]) >= 0) return pool[j];
      }
    }
    var local = pool.filter(function (v) { return v.localService; });
    return local[0] || pool[0];
  }

  /* Regle absolue : jamais d'anglais avec une voix francaise (et l'inverse). */
  function speak(text, lang, opts) {
    opts = opts || {};
    if (!window.speechSynthesis || !text) return Promise.resolve();
    var v = pickVoice(lang);
    if (!v) return Promise.resolve();

    return new Promise(function (resolve) {
      var u = new window.SpeechSynthesisUtterance(text);
      u.voice = v;
      u.lang = v.lang;
      u.rate = opts.rate || App.State.get().settings.rate || 0.85;
      u.pitch = 1.05;
      u.onend = resolve;
      u.onerror = resolve;
      try { speechSynthesis.speak(u); } catch (e) { resolve(); }
      setTimeout(resolve, 420 + String(text).length * 130);
    });
  }

  /* Enchainer plusieurs cles : ['fr:phoneme:m','fr:phoneme:a','fr:syll:ma'] */
  function sequence(keys, gap) {
    var i = 0;
    stop();
    function step() {
      if (i >= keys.length) return Promise.resolve();
      var k = keys[i++];
      return play(k, { stopFirst: false })
        .then(function () { return new Promise(function (r) { setTimeout(r, gap == null ? 240 : gap); }); })
        .then(step, step);
    }
    return step();
  }

  /* ---------- Effets, generes sans aucun fichier ---------- */

  function tone(freqs, dur, type) {
    if (!App.State.get().settings.sound) return;
    try {
      var C = window.AudioContext || window.webkitAudioContext;
      if (!C) return;
      var ctx = App.Audio._ctx || (App.Audio._ctx = new C());
      var t0 = ctx.currentTime;
      freqs.forEach(function (f, i) {
        var o = ctx.createOscillator(), g = ctx.createGain();
        o.type = type || 'sine';
        o.frequency.setValueAtTime(f, t0 + i * dur);
        g.gain.setValueAtTime(0.0001, t0 + i * dur);
        g.gain.exponentialRampToValueAtTime(0.16, t0 + i * dur + 0.02);
        g.gain.exponentialRampToValueAtTime(0.0001, t0 + i * dur + dur);
        o.connect(g); g.connect(ctx.destination);
        o.start(t0 + i * dur); o.stop(t0 + i * dur + dur + 0.02);
      });
    } catch (e) {}
  }

  var sfx = {
    good:   function () { tone([660, 880], 0.11); },
    great:  function () { tone([523, 659, 784, 1047], 0.1); },
    soft:   function () { tone([392, 349], 0.13); },
    pop:    function () { tone([520], 0.07, 'triangle'); },
    unlock: function () { tone([523, 784, 1047, 1319], 0.13); }
  };

  /* ---------- Voix disponibles ---------- */

  function refresh() {
    if (!window.speechSynthesis) return;
    voices = speechSynthesis.getVoices() || [];
    if (voices.length) { ready.forEach(function (f) { f(); }); ready = []; }
  }

  function init() {
    refresh();
    if (window.speechSynthesis) {
      speechSynthesis.onvoiceschanged = refresh;
      setTimeout(refresh, 300);
      setTimeout(refresh, 1200);
    }
  }

  return {
    init: init,
    play: play,
    sequence: sequence,
    speak: speak,
    stop: stop,
    sfx: sfx,
    slugify: slugify,
    path: path,
    has: function (lang) { return !!pickVoice(lang); },
    hasRecordings: function () {
      for (var k in known) { if (known[k] === 'file') return true; }
      return !!(App.Voice && App.Voice.count());
    },
    source: function (key) {
      if (known[key] === 'file') return 'fichier';
      if (App.Voice && App.Voice.has(key)) return 'voix du parent';
      return 'synthese';
    },
    listFor: function (lang) {
      var want = lang === 'en' ? 'en' : 'fr';
      return voices.filter(function (v) { return (v.lang || '').toLowerCase().indexOf(want) === 0; });
    },
    onReady: function (f) { if (voices.length) f(); else ready.push(f); },

    /* Raccourcis lisibles depuis le reste du code */
    phoneme: function (lang, s) { return play(lang + ':phoneme:' + slugify(s)); },
    word:    function (lang, w) { return play(lang + ':word:' + slugify(w)); },
    syll:    function (lang, s) { return play(lang + ':syll:' + slugify(s)); },
    ui:      function (lang, k) { return play(lang + ':ui:' + k); },
    line:    function (lang, i) { return play(lang + ':line:' + i); }
  };
})();

</script>
<script>
/* ===== js/engine.js ===== */
/* =========================================================
   js/engine.js — Ouverture des missions et lecture de la progression

   Regle simple et lisible : une mission s'ouvre quand la precedente
   de la meme langue est terminee. Pas de niveau numerique, pas de
   deblocage arbitraire.
   ========================================================= */

window.App = window.App || {};

App.Engine = (function () {

  function all(lang) { return DATA.missions[lang] || []; }

  function byId(id) {
    var a = all('fr').concat(all('en'));
    for (var i = 0; i < a.length; i++) if (a[i].id === id) return a[i];
    return null;
  }

  function playable(m) { return !!(m && !m.locked && m.steps && m.steps.length); }

  /* Ouverte si : premiere de la langue, ou precedente terminee. */
  function isOpen(m) {
    var list = all(m.id.indexOf('en.') === 0 ? 'en' : 'fr');
    var i = list.indexOf(m);
    if (i <= 0) return true;
    var prev = list[i - 1];
    return App.State.isMissionDone(prev.id);
  }

  function status(m) {
    if (App.State.isMissionDone(m.id)) return 'done';
    if (!playable(m)) return 'soon';
    return isOpen(m) ? 'now' : 'locked';
  }

  /* La prochaine mission a faire dans une langue */
  function next(lang) {
    var list = all(lang);
    for (var i = 0; i < list.length; i++) {
      if (!App.State.isMissionDone(list[i].id) && playable(list[i]) && isOpen(list[i])) return list[i];
    }
    /* Tout ce qui est jouable est fait : on propose de refaire la derniere */
    for (var j = list.length - 1; j >= 0; j--) {
      if (playable(list[j])) return list[j];
    }
    return null;
  }

  function progress(lang) {
    var list = all(lang);
    if (!list.length) return 0;
    var done = 0;
    list.forEach(function (m) { if (App.State.isMissionDone(m.id)) done++; });
    return Math.round(done / list.length * 100);
  }

  function playableProgress(lang) {
    var list = all(lang).filter(playable);
    if (!list.length) return 0;
    var done = 0;
    list.forEach(function (m) { if (App.State.isMissionDone(m.id)) done++; });
    return Math.round(done / list.length * 100);
  }

  /* Missions groupees par monde, pour la carte */
  function worlds(lang) {
    var out = [];
    (DATA.worlds[lang] || []).forEach(function (w) {
      var ms = all(lang).filter(function (m) { return m.world === w.n; });
      if (ms.length) out.push({ world: w, missions: ms });
    });
    return out;
  }

  function currentWorld(lang) {
    var n = next(lang);
    return n ? n.world : 1;
  }

  /* ---------- Vue parent : les competences ---------- */

  function skillsFor(lang) {
    return (DATA[lang].skills || []).map(function (sk) {
      var m = App.State.get().mastery[sk.id];
      return {
        id: sk.id, label: sk.label, world: sk.world, type: sk.type,
        score: m ? Math.round(m.score) : 0,
        attempts: m ? m.attempts : 0,
        correct: m ? m.correct : 0,
        seen: m ? m.seen : 0,
        last: m ? m.last : null,
        dims: m ? m.dims : null
      };
    });
  }

  function stateOf(score, attempts) {
    if (!attempts) return DATA.masteryStates[0];
    var st = DATA.masteryStates[0];
    DATA.masteryStates.forEach(function (x) { if (score >= x.min) st = x; });
    return st;
  }

  /* Ce qu'il faut retravailler : vu au moins une fois, score faible */
  function toReinforce(lang) {
    return skillsFor(lang)
      .filter(function (s) { return s.attempts >= 2 && s.score < 75; })
      .sort(function (a, b) { return a.score - b.score; });
  }

  /* La progression racontee, pas chiffree (§23) */
  function narrative(lang) {
    var done = App.State.missionsDone(lang);
    var name = lang === 'fr' ? 'fran\u00e7ais' : 'anglais';
    if (!done) return 'Alexis n\'a pas encore commenc\u00e9 le parcours ' + name + '.';
    var n = next(lang);
    var weak = toReinforce(lang);
    var txt = 'Alexis a termin\u00e9 ' + done + ' mission' + (done > 1 ? 's' : '') + ' en ' + name + '. ';
    if (n && App.Engine.playable(n)) txt += 'Il travaille maintenant : ' + n.title + '. ';
    if (weak.length) txt += 'Le point le plus fragile reste ' + weak[0].label + '.';
    else if (done >= 2) txt += 'Rien ne bloque pour l\'instant.';
    return txt;
  }

  return {
    all: all, byId: byId, playable: playable, isOpen: isOpen, status: status,
    next: next, progress: progress, playableProgress: playableProgress,
    worlds: worlds, currentWorld: currentWorld,
    skillsFor: skillsFor, stateOf: stateOf, toReinforce: toReinforce, narrative: narrative
  };
})();

</script>
<script>
/* ===== js/skills.js ===== */
/* =========================================================
   js/skills.js — Le modele de maitrise

   Une competence n'est pas "faite / pas faite" (§9). Elle vit dans
   trois etats visibles :

     rouge   a revoir        score < 55
     orange  en consolidation 55 a 84
     vert    maitrise         >= 85, avec assez d'essais

   Ces etats pilotent deux choses concretes :
     - ce que l'espace parent affiche
     - ce que le moteur reinjecte automatiquement dans les seances

   Une competence n'est jamais verte au premier essai reussi : il faut
   du volume ET de la duree. C'est ce qui distingue "il a trouve" de
   "il sait".
   ========================================================= */

window.App = window.App || {};

App.Skills = (function () {

  var GREEN = 85, ORANGE = 55, MIN_TRIES = 6;

  function all(lang) { return (DATA[lang] && DATA[lang].skills) || []; }

  function byId(id) {
    var a = all('fr').concat(all('en'));
    for (var i = 0; i < a.length; i++) if (a[i].id === id) return a[i];
    return null;
  }

  function raw(id) { return App.State.get().mastery[id] || null; }

  function score(id) {
    var m = raw(id);
    return m ? Math.round(m.score) : 0;
  }

  /* 'none' | 'red' | 'orange' | 'green' */
  function state(id) {
    var m = raw(id);
    if (!m || !m.attempts) return 'none';
    if (m.score >= GREEN && m.attempts >= MIN_TRIES) return 'green';
    if (m.score >= ORANGE) return 'orange';
    return 'red';
  }

  var DOT = { none: '\u25cb', red: '\ud83d\udd34', orange: '\ud83d\udfe0', green: '\ud83d\udfe2' };
  var NAME = {
    none: 'Pas encore vue', red: '\u00c0 revoir',
    orange: 'En consolidation', green: 'Ma\u00eetris\u00e9e'
  };

  function dot(id) { return DOT[state(id)]; }
  function label(id) { return NAME[state(id)]; }

  /* Les competences fragiles, les plus urgentes d'abord.
     On pondere par l'oubli : une notion rouge vue il y a six jours
     passe devant une notion orange vue ce matin. */
  function fragile(lang) {
    var now = Date.now();
    return all(lang)
      .filter(function (sk) {
        var st = state(sk.id);
        return st === 'red' || st === 'orange';
      })
      .map(function (sk) {
        var m = raw(sk.id);
        var days = m && m.last ? (now - m.last) / 86400000 : 0;
        return {
          skill: sk,
          score: Math.round(m.score),
          state: state(sk.id),
          days: Math.floor(days),
          urgency: (100 - m.score) + Math.min(days, 14) * 4
        };
      })
      .sort(function (a, b) { return b.urgency - a.urgency; });
  }

  function mastered(lang) {
    return all(lang).filter(function (sk) { return state(sk.id) === 'green'; });
  }

  function seen(lang) {
    return all(lang).filter(function (sk) { return state(sk.id) !== 'none'; });
  }

  /* ---------- Les grandes familles, pour l'espace parent (§22) ---------- */

  var GROUPS = {
    fr: [
      { key: 'sons',    label: 'Sons',          types: ['phono', 'grapheme', 'complex'] },
      { key: 'syll',    label: 'Syllabes',      types: ['blend', 'syllable'] },
      { key: 'mots',    label: 'Mots',          types: ['word', 'tricky'] },
      { key: 'phrases', label: 'Phrases',       types: ['sentence', 'fluency'] },
      { key: 'comp',    label: 'Compr\u00e9hension', types: ['comprehension', 'story'] }
    ],
    en: [
      { key: 'phonics', label: 'Phonics',       types: ['phono', 'grapheme'] },
      { key: 'blend',   label: 'Blending',      types: ['blend', 'syllable'] },
      { key: 'cvc',     label: 'CVC words',     types: ['word'] },
      { key: 'tricky',  label: 'Tricky words',  types: ['tricky', 'complex'] },
      { key: 'sent',    label: 'Sentences',     types: ['sentence', 'fluency'] },
      { key: 'comp',    label: 'Comprehension', types: ['comprehension', 'story'] }
    ]
  };

  function groups(lang) {
    return GROUPS[lang].map(function (g) {
      var list = all(lang).filter(function (sk) { return g.types.indexOf(sk.type) >= 0; });
      var green = 0, orange = 0, red = 0, none = 0;
      list.forEach(function (sk) {
        var st = state(sk.id);
        if (st === 'green') green++;
        else if (st === 'orange') orange++;
        else if (st === 'red') red++;
        else none++;
      });
      return {
        key: g.key, label: g.label, total: list.length,
        green: green, orange: orange, red: red, none: none,
        percent: list.length ? Math.round(green / list.length * 100) : 0
      };
    });
  }

  /* ---------- Ce que le moteur doit reinjecter ---------- */

  /* n competences a reviser maintenant, les plus fragiles d'abord,
     mais uniquement celles pour lesquelles on sait fabriquer un exercice. */
  function toReview(lang, n) {
    return fragile(lang)
      .filter(function (f) { return App.Practice.can(f.skill); })
      .slice(0, n || 2);
  }

  return {
    all: all, byId: byId, score: score, state: state, dot: dot, label: label,
    fragile: fragile, mastered: mastered, seen: seen,
    groups: groups, toReview: toReview,
    GREEN: GREEN, ORANGE: ORANGE
  };
})();

</script>
<script>
/* ===== js/practice.js ===== */
/* =========================================================
   js/practice.js — Le generateur d'entrainement

   Meme moteur d'activites, mais le contenu n'est plus ecrit a la main :
   il est fabrique a partir de la definition d'une competence.

   C'est ce qui permet :
     - la section "Je m'entraine" (§8)
     - la reinjection automatique des competences fragiles (§9)
     - de faire grossir le parcours sans ecrire 100 ecrans (§5)

   Une competence sait donc produire ses propres exercices.
   ========================================================= */

window.App = window.App || {};

App.Practice = (function () {

  function lang(sk) { return sk.id.indexOf('en.') === 0 ? 'en' : 'fr'; }

  function pics(l) {
    var out = [];
    App.Skills.all(l).forEach(function (sk) {
      (sk.examples || []).forEach(function (x) {
        if (x.e) out.push({ t: x.w, e: x.e, first: sk.lower || '' });
      });
    });
    return out;
  }

  function pick(a) { return a[Math.floor(Math.random() * a.length)]; }

  function others(l, sk, n) {
    var pool = pics(l).filter(function (w) { return w.first !== (sk.lower || ''); });
    var out = [], seen = {};
    while (out.length < n && pool.length) {
      var w = pick(pool);
      if (!seen[w.t]) { seen[w.t] = 1; out.push(w); }
      if (Object.keys(seen).length >= pool.length) break;
    }
    return out;
  }

  function letters(l, sk, n) {
    var pool = App.Skills.all(l)
      .filter(function (x) { return x.lower && x.lower.length === 1 && x.id !== sk.id; })
      .map(function (x) { return x.label; });
    var out = [], seen = {};
    while (out.length < n && pool.length) {
      var v = pick(pool);
      if (!seen[v]) { seen[v] = 1; out.push(v); }
      if (Object.keys(seen).length >= pool.length) break;
    }
    return out;
  }

  /* ---------- Sait-on fabriquer quelque chose pour cette competence ? ---------- */

  function can(sk) {
    if (!sk) return false;
    if (sk.type === 'grapheme' || sk.type === 'complex') return !!sk.lower;
    if (sk.type === 'phono') return true;
    if (sk.type === 'blend') return !!sk.consonant || sk.id.indexOf('.b.') > 0;
    return false;
  }

  /* ---------- Les generateurs ---------- */

  var G = {};

  /* Un son et sa lettre : quatre facons de le travailler */
  G.grapheme = function (sk, l) {
    var key = l + ':phoneme:' + App.Audio.slugify(sk.lower);
    var ex = (sk.examples || []).filter(function (x) { return x.e; });
    var out = [];

    out.push({ act: 'find-letter', phase: 'practice', skill: sk.id,
      phonemeKey: key, good: sk.label, bad: letters(l, sk, 3) });

    if (ex.length) {
      var g = pick(ex), bad = others(l, sk, 2);
      if (bad.length === 2) {
        out.push({ act: 'sound-in-words', phase: 'practice', skill: sk.id,
          phonemeKey: key,
          good: { t: g.w, e: g.e },
          bad: bad.map(function (b) { return { t: b.t, e: b.e }; }) });
      }
    }

    out.push({ act: 'catch', phase: 'practice', skill: sk.id,
      phonemeKey: key, target: sk.label,
      pool: shuffle([sk.label, sk.label, sk.label, sk.label, sk.label]
        .concat(letters(l, sk, 3), letters(l, sk, 3), letters(l, sk, 1))) });

    if (ex.length >= 3) {
      out.push({ act: 'memory', phase: 'practice', skill: sk.id,
        pairs: ex.slice(0, 3).map(function (x) { return { e: x.e, label: x.w }; }) });
    }

    if (ex.length) {
      var w = pick(ex);
      out.push({ act: 'first-sound', phase: 'practice', skill: sk.id,
        word: { t: w.w, e: w.e },
        good: sk.say,
        bad: pickSays(l, sk, 2) });
    }
    return out;
  };

  G.complex = G.grapheme;

  /* Une fusion : on la refait, et on reconstruit la syllabe */
  G.blend = function (sk, l) {
    var cons = App.Skills.byId(sk.consonant);
    if (!cons) return [];
    var vowels = l === 'fr' ? ['A', 'I', 'O'] : ['A', 'I', 'O'];
    var v = pick(vowels);
    var vSk = App.Skills.all(l).filter(function (x) {
      return x.label === v && x.type === 'grapheme';
    })[0];
    if (!vSk) return [];
    var res = cons.label + v;
    return [
      { act: 'blend', phase: 'decode', skill: sk.id,
        a: { l: cons.label, key: l + ':phoneme:' + cons.lower },
        b: { l: v, key: l + ':phoneme:' + vSk.lower },
        result: res, resultKey: l + ':syll:' + res.toLowerCase(),
        bad: [v + cons.label, cons.label + (v === 'A' ? 'I' : 'A')],
        scaffold: [l + ':phoneme:' + cons.lower, l + ':phoneme:' + vSk.lower,
                   l + ':syll:' + res.toLowerCase()] },
      { act: 'build', phase: 'decode', skill: sk.id,
        target: res, kind: 'letters',
        bricks: [cons.label, v].concat(letters(l, cons, 2)),
        audioKey: l + ':syll:' + res.toLowerCase() }
    ];
  };

  /* Conscience phonologique : rimes, syllabes, premier son */
  G.phono = function (sk, l) {
    var bank = pics(l);
    if (bank.length < 4) return [];
    var a = pick(bank), b = pick(bank.filter(function (x) { return x.t !== a.t; }));
    var c = pick(bank.filter(function (x) { return x.t !== a.t && x.t !== b.t; }));
    if (sk.id.indexOf('initial') > 0 || sk.id.indexOf('.ph.i') > 0) {
      return [{ act: 'same-start', phase: 'practice', skill: sk.id,
        pair: pairSameStart(l) || [a, b], other: c }];
    }
    return [{ act: 'clap', phase: 'practice', skill: sk.id,
      word: { t: a.t, e: a.e, n: syllables(a.t) } }];
  };

  function pairSameStart(l) {
    var bank = pics(l), by = {};
    bank.forEach(function (w) { (by[w.first] = by[w.first] || []).push(w); });
    for (var k in by) if (by[k].length >= 2) return [by[k][0], by[k][1]];
    return null;
  }

  function syllables(w) {
    var n = (w.toUpperCase().match(/[AEIOUY\u00c9\u00c8\u00ca\u00c0\u00d4\u00db]+/g) || []).length;
    return Math.max(1, Math.min(3, n));
  }

  function pickSays(l, sk, n) {
    var pool = App.Skills.all(l)
      .filter(function (x) { return x.say && x.id !== sk.id && x.type === 'grapheme'; })
      .map(function (x) { return x.say; });
    var out = [], seen = {};
    while (out.length < n && pool.length) {
      var v = pick(pool);
      if (!seen[v] && v !== sk.say) { seen[v] = 1; out.push(v); }
      if (Object.keys(seen).length >= pool.length) break;
    }
    return out;
  }

  function shuffle(a) {
    a = a.slice();
    for (var i = a.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1)), t = a[i]; a[i] = a[j]; a[j] = t;
    }
    return a;
  }

  /* ---------- API ---------- */

  /* Renvoie n activites pretes a jouer pour une competence donnee */
  function build(sk, n) {
    if (!can(sk)) return [];
    var l = lang(sk);
    var g = G[sk.type];
    if (!g) return [];
    var made = shuffle(g(sk, l)).filter(Boolean);
    return made.slice(0, n || made.length);
  }

  /* Une mini-session d'entrainement sur une competence : 4 activites + cloture */
  function session(sk) {
    var acts = build(sk, 4);
    if (!acts.length) return null;
    var l = lang(sk);
    return {
      id: 'practice.' + sk.id,
      practice: true,
      title: sk.label,
      subtitle: App.Skills.label(sk.id),
      icon: '\ud83c\udfae',
      skill: sk.id,
      learned: sk.label,
      steps: acts.concat([{ act: 'wrap', phase: 'reward',
        learned: (l === 'fr' ? 'Tu as revu : ' : 'You reviewed: ') + sk.label }])
    };
  }

  /* Les competences qu'on peut proposer a l'entrainement, groupees */
  function catalogue(lang) {
    var out = [];
    App.Skills.all(lang).forEach(function (sk) {
      if (!can(sk)) return;
      var st = App.Skills.state(sk.id);
      if (st === 'none') return;
      out.push({ skill: sk, state: st, score: App.Skills.score(sk.id) });
    });
    return out;
  }

  return { can: can, build: build, session: session, catalogue: catalogue, lang: lang };
})();

</script>
<script>
/* ===== js/session.js ===== */
/* =========================================================
   js/session.js — "Ma seance"

   La seance recommandee du moment (§10). Elle melange :
     - une nouvelle competence   (la prochaine lecon du parcours)
     - de la revision            (les competences fragiles, §9)
     - de la lecture             (un livre debloque et non lu)

   Elle n'est pas figee : elle se recompose a chaque ouverture, a
   partir de l'etat reel de l'enfant.
   ========================================================= */

window.App = window.App || {};

App.Session = (function () {

  /* Renvoie la composition de la seance, pas encore jouee */
  function plan(lang) {
    var lesson = App.Engine.next(lang);
    var review = App.Skills.toReview(lang, 2);
    var book = firstUnreadBook(lang);

    var parts = [];
    if (lesson && App.Engine.playable(lesson)) {
      parts.push({ kind: 'lesson', icon: lesson.icon, label: lesson.title,
                   sub: lesson.subtitle || '', mission: lesson });
    }
    review.forEach(function (r) {
      parts.push({ kind: 'review', icon: App.Skills.dot(r.skill.id),
                   label: r.skill.label, sub: App.Skills.label(r.skill.id),
                   skill: r.skill });
    });
    if (book) {
      parts.push({ kind: 'book', icon: '\ud83d\udcd6', label: book.title,
                   sub: '', book: book });
    }
    return { lang: lang, parts: parts, minutes: estimate(parts) };
  }

  function estimate(parts) {
    var m = 0;
    parts.forEach(function (p) {
      if (p.kind === 'lesson') m += Math.round(p.mission.steps.length * 0.7);
      if (p.kind === 'review') m += 2;
      if (p.kind === 'book') m += 3;
    });
    return Math.max(4, m);
  }

  function firstUnreadBook(lang) {
    var read = App.State.get().booksRead;
    return DATA.books.filter(function (b) {
      return b.lang === lang && App.State.isBookUnlocked(b.id) && read.indexOf(b.id) < 0;
    })[0] || null;
  }

  /* Lance la seance : on enchaine ses parties l'une apres l'autre. */
  function start(lang) {
    var p = plan(lang);
    if (!p.parts.length) return false;
    queue = p.parts.slice();
    runNext();
    return true;
  }

  var queue = [];

  function runNext() {
    var part = queue.shift();
    if (!part) { App.UI.refresh(); return; }

    if (part.kind === 'lesson') {
      App.Mission.start(part.mission, runNext);
    } else if (part.kind === 'review') {
      var s = App.Practice.session(part.skill);
      if (s) App.Mission.start(s, runNext);
      else runNext();
    } else if (part.kind === 'book') {
      App.UI.openBook(part.book, runNext);
    }
  }

  function clear() { queue = []; }

  return { plan: plan, start: start, clear: clear };
})();

</script>
<script>
/* ===== js/activities.js ===== */
/* =========================================================
   js/activities.js — Les mecaniques d'activite

   Chaque mecanique recoit (step, ctx) et dessine dans ctx.root.
   Elle appelle ctx.win() quand l'enfant reussit, ctx.miss() sinon.
   Le deroule, le feedback et l'etayage sont geres par js/mission.js.

   ctx = { lang, mission, root, win, miss, T, say }
   ========================================================= */

window.App = window.App || {};

App.Activities = (function () {

  /* ---------- petits outils ---------- */

  function el(tag, cls, txt) {
    var n = document.createElement(tag);
    if (cls) n.className = cls;
    if (txt != null) n.textContent = txt;
    return n;
  }

  function shuffle(a) {
    a = a.slice();
    for (var i = a.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1)), t = a[i]; a[i] = a[j]; a[j] = t;
    }
    return a;
  }

  /* ---------------------------------------------------------
     LA CONSIGNE — primitive centrale de l'application.

     L'enfant n'a pas a LIRE pour comprendre : le texte affiche est
     court et sert de support visuel, c'est la voix qui explique.
     Chaque consigne est donc :
       - prononcee automatiquement a l'ouverture de l'activite
       - reecoutable a volonte par le bouton du haut-parleur
       - suivie du "materiel" a entendre (le son, le mot)

     key    cle i18n (texte court affiche) et cle audio associee
     after  mot dynamique dit apres la consigne  ("... avec CHAT")
     then   fonction rendant le materiel sonore de l'activite
     quiet  true = on affiche sans relancer la lecture automatique
     --------------------------------------------------------- */
  function instruction(ctx, key, opts) {
    opts = opts || {};
    var label = ctx.T(key) + (opts.after ? ' ' + opts.after : '') + (opts.mark || '');

    var row = el('div', 'inst');
    row.appendChild(el('div', 'act__inst', label));
    var rp = el('button', 'inst__rp');
    rp.setAttribute('aria-label', 'Reecouter');
    rp.textContent = '\ud83d\udd0a';
    rp.addEventListener('click', function () {
      rp.classList.add('is-playing');
      setTimeout(function () { rp.classList.remove('is-playing'); }, 900);
      ctx.sayInstruction();
    });
    row.appendChild(rp);
    ctx.root.appendChild(row);

    if (!opts.quiet) ctx.setInstruction(key, opts);
    return row;
  }

  /* Gros bouton d'ecoute. C'est le geste central de l'application. */
  function listen(ctx, key, label) {
    var b = el('button', 'listen');
    b.appendChild(el('span', 'listen__ico', '\ud83d\udd0a'));
    if (label) b.appendChild(el('span', 'listen__lbl', label));
    b.addEventListener('click', function () {
      b.classList.add('is-playing');
      setTimeout(function () { b.classList.remove('is-playing'); }, 900);
      ctx.play(key);
    });
    ctx.root.appendChild(b);
    return b;
  }

  function listenText(ctx, text, lang, label) {
    var b = el('button', 'listen');
    b.appendChild(el('span', 'listen__ico', '\ud83d\udd0a'));
    if (label) b.appendChild(el('span', 'listen__lbl', label));
    b.addEventListener('click', function () {
      b.classList.add('is-playing');
      setTimeout(function () { b.classList.remove('is-playing'); }, 900);
      App.Audio.speak(text, lang || ctx.lang);
    });
    ctx.root.appendChild(b);
    return b;
  }

  /* Grille de reponses. onPick(choice, node) -> true si correct */
  function choices(ctx, list, opts) {
    opts = opts || {};
    var grid = el('div', 'choices' + (opts.cls ? ' ' + opts.cls : ''));
    shuffle(list).forEach(function (c) {
      var b = el('button', 'choice' + (c.kind ? ' choice--' + c.kind : ''));
      if (c.correct) b.setAttribute('data-ok', '1');
      b.appendChild(el('span', 'choice__main', c.label));
      if (c.sub) b.appendChild(el('span', 'choice__sub', c.sub));
      b.addEventListener('click', function () {
        if (b.classList.contains('is-off') || grid.classList.contains('is-locked')) return;
        if (c.say) ctx.playText(c.say, c.lang);
        else if (c.key) ctx.play(c.key);
        if (c.correct) {
          grid.classList.add('is-locked');
          b.classList.add('is-right');
          ctx.win();
        } else {
          b.classList.add('is-off');
          ctx.miss(b, grid);
        }
      });
      grid.appendChild(b);
    });
    ctx.root.appendChild(grid);
    return grid;
  }

  function imgChoice(o, correct) {
    return { label: o.e, sub: null, correct: !!correct, kind: 'img', say: o.t, word: o.t };
  }

  /* =========================================================
     1. DECOUVERTE — l'enfant rencontre le son, sans rien a reussir
     ========================================================= */
  var A = {};

  A.discover = function (step, ctx) {
    var card = el('div', 'discover');
    card.appendChild(el('div', 'discover__big' + (step.letter ? ' read' : ''), step.big));
    card.appendChild(el('div', 'discover__title', step.title));
    ctx.root.appendChild(card);

    if (step.phonemeKey) listen(ctx, step.phonemeKey, ctx.T('listen'));
    else if (step.say) listenText(ctx, step.say.text, step.say.lang, ctx.T('listen'));

    if (step.examples) {
      var row = el('div', 'exrow');
      step.examples.forEach(function (x) {
        var b = el('button', 'ex');
        b.appendChild(el('span', 'ex__e', x.e));
        b.appendChild(el('span', 'ex__t read', x.t));
        b.addEventListener('click', function () { ctx.playText(x.t); });
        row.appendChild(b);
      });
      ctx.root.appendChild(row);
    }
    if (step.lines) {
      var ll = el('div', 'lines');
      step.lines.forEach(function (l) { ll.appendChild(el('div', 'lines__l read', l)); });
      ctx.root.appendChild(ll);
    }
    if (step.note) ctx.root.appendChild(el('div', 'note', step.note));

    var go = el('button', 'btn btn--primary btn--block', ctx.T('continue'));
    go.addEventListener('click', function () { ctx.win(true); });
    ctx.root.appendChild(go);

    /* Une decouverte est une consigne comme une autre : elle se joue
       toute seule et se reecoute par le meme bouton. */
    ctx.setSpoken(function () {
      if (step.phonemeKey) return ctx.play(step.phonemeKey);
      if (step.say) return App.Audio.speak(step.say.text, step.say.lang);
      return null;
    });
  };

  /* =========================================================
     2. COMBIEN DE MORCEAUX  (conscience syllabique)
     ========================================================= */
  A['syllable-count'] = function (step, ctx) {
    var it = step.items[Math.floor(Math.random() * step.items.length)];
    instruction(ctx, 'q_syllCount', { then: function () { return ctx.playText(it.t); } });
    var card = el('div', 'bigimg');
    card.appendChild(el('div', 'bigimg__e', it.e));
    card.appendChild(el('div', 'bigimg__t read', it.t));
    ctx.root.appendChild(card);
    listenText(ctx, it.t);

    instruction(ctx, 'q_sortIntro', { then: function () { return ctx.play(step.phonemeKey); } });
    listen(ctx, step.phonemeKey, ctx.T('listen'));

    var board = el('div', 'sort');
    var colYes = el('div', 'sort__col sort__col--yes');
    colYes.appendChild(el('div', 'sort__h', ctx.T('q_sortYes') + ' ' + step.letter));
    var binYes = el('div', 'sort__bin'); colYes.appendChild(binYes);
    var colNo = el('div', 'sort__col sort__col--no');
    colNo.appendChild(el('div', 'sort__h', ctx.T('q_sortNo')));
    var binNo = el('div', 'sort__bin'); colNo.appendChild(binNo);
    board.appendChild(colYes); board.appendChild(colNo);
    ctx.root.appendChild(board);

    var pool = el('div', 'sort__pool');
    ctx.root.appendChild(pool);

    var items = shuffle(
      step.yes.map(function (o) { return { o: o, yes: true }; })
        .concat(step.no.map(function (o) { return { o: o, yes: false }; })));
    var left = items.length, sel = null;

    items.forEach(function (it) {
      var t = el('button', 'tile');
      t.appendChild(el('span', 'tile__e', it.o.e));
      t.appendChild(el('span', 'tile__t read', it.o.t));
      t.addEventListener('click', function () {
        if (t.classList.contains('is-placed')) return;
        ctx.playText(it.o.t);
        if (sel) sel.classList.remove('is-sel');
        sel = t; t.classList.add('is-sel');
      });
      it.node = t;
      pool.appendChild(t);
    });

    function drop(wantYes, bin) {
      return function () {
        if (!sel) return;
        var it = items.filter(function (x) { return x.node === sel; })[0];
        if (!it) return;
        if (it.yes === wantYes) {
          sel.classList.remove('is-sel');
          sel.classList.add('is-placed');
          bin.appendChild(sel);
          sel = null;
          App.Audio.sfx.pop();
          if (--left === 0) ctx.win();
        } else {
          ctx.miss(sel);
        }
      };
    }
    colYes.addEventListener('click', drop(true, binYes));
    colNo.addEventListener('click', drop(false, binNo));
  };

  A.build = function (step, ctx) {
    instruction(ctx, 'q_build', { then: function () { return step.audioKey ? ctx.play(step.audioKey) : null; } });
    if (step.audioKey) listen(ctx, step.audioKey, ctx.T('listen'));

    var parts = step.kind === 'syllables'
      ? cutSyll(step.target, step.bricks)
      : step.target.split('');

    var slots = el('div', 'slots');
    var slotNodes = parts.map(function () {
      var s = el('div', 'slot'); slots.appendChild(s); return s;
    });
    ctx.root.appendChild(slots);

    var bank = el('div', 'bricks');
    ctx.root.appendChild(bank);
    var filled = 0;

    shuffle(step.bricks).forEach(function (v) {
      var br = el('button', 'brick read', v);
      br.addEventListener('click', function () {
        if (br.classList.contains('is-used')) return;
        if (v === parts[filled]) {
          br.classList.add('is-used');
          slotNodes[filled].textContent = v;
          slotNodes[filled].classList.add('is-full');
          filled++;
          App.Audio.sfx.pop();
          if (filled === parts.length) {
            slots.classList.add('is-done');
            if (step.audioKey) ctx.play(step.audioKey);
            setTimeout(function () { ctx.win(); }, 500);
          }
        } else {
          ctx.miss(br);
        }
      });
      bank.appendChild(br);
    });
  };

  /* Decoupe LAMA en LA + MA a partir des briques disponibles */
  function cutSyll(target, bricks) {
    var out = [], rest = target;
    var sorted = bricks.slice().sort(function (a, b) { return b.length - a.length; });
    var guard = 0;
    while (rest.length && guard++ < 12) {
      var hit = null;
      for (var i = 0; i < sorted.length; i++) {
        if (rest.indexOf(sorted[i]) === 0) { hit = sorted[i]; break; }
      }
      if (!hit) { out.push(rest); break; }
      out.push(hit);
      rest = rest.slice(hit.length);
    }
    return out;
  }
